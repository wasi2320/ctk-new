<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="iacReviewTitle iacReviewDesc">
  <title id="iacReviewTitle">AI-generated infrastructure as code review checklist</title>
  <desc id="iacReviewDesc">An eight-step review path moves an AI-generated infrastructure draft through a pull request, formatting and validation, security and policy checks, plan and diff review, human approval, staged deployment, and rollback readiness.</desc>
  <defs>
    <linearGradient id="iacReviewBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EAF4FC"/>
    </linearGradient>
    <filter id="iacReviewShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17324D" flood-opacity=".1"/>
    </filter>
    <marker id="iacReviewBlueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 9 5 1 9Z" fill="#2563EB"/>
    </marker>
    <marker id="iacReviewGreenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 9 5 1 9Z" fill="#0E9F6E"/>
    </marker>
    <style>
      .irt{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#102A43}
      .irh{font-size:34px;font-weight:760}
      .irsub{font-size:15px;fill:#52677C}
      .ircap{font-size:11px;font-weight:760;letter-spacing:1.1px}
      .irname{font-size:15px;font-weight:740}
      .irmeta{font-size:11.5px;fill:#61758A}
      .ircard{fill:#FFFFFF;stroke:#D3E1ED;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#iacReviewBg)"/>
  <rect x="28" y="26" width="1144" height="578" rx="24" fill="none" stroke="#D7E4EF"/>
  <g class="irt">
    <text class="irh" x="58" y="70">AI-generated infrastructure as code review checklist</text>
    <text class="irsub" x="58" y="98">Treat generated Terraform and Kubernetes changes as proposals that must pass the same delivery controls as human work.</text>
    <g transform="translate(948 44)">
      <rect width="194" height="36" rx="18" fill="#E9F8F3"/>
      <circle cx="19" cy="18" r="5" fill="#0E9F6E"/>
      <text x="33" y="22" font-size="11" font-weight="750" fill="#087A55">REVIEWABLE AND REVERSIBLE</text>
    </g>

    <text class="ircap" x="58" y="146" fill="#2563EB">DRAFT AND AUTOMATED REVIEW</text>
    <g filter="url(#iacReviewShadow)">
      <g transform="translate(58 166)">
        <rect class="ircard" width="242" height="128" rx="17"/>
        <circle cx="31" cy="31" r="16" fill="#7C3AED"/><text x="31" y="36" text-anchor="middle" font-size="13" font-weight="760" fill="#FFFFFF">1</text>
        <circle cx="121" cy="41" r="20" fill="#F2EAFE"/><path d="M112 41h18M121 32v18M108 30l4 4M134 30l-4 4" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round"/>
        <text class="irname" x="121" y="78" text-anchor="middle">AI draft</text>
        <text class="irmeta" x="121" y="101" text-anchor="middle">Proposed configuration only</text>
      </g>
      <g transform="translate(338 166)">
        <rect class="ircard" width="242" height="128" rx="17"/>
        <circle cx="31" cy="31" r="16" fill="#2563EB"/><text x="31" y="36" text-anchor="middle" font-size="13" font-weight="760" fill="#FFFFFF">2</text>
        <circle cx="121" cy="41" r="20" fill="#E8F2FF"/><path d="M109 34h24v17h-24zM114 29h14v5M114 40h14M114 45h10" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
        <text class="irname" x="121" y="78" text-anchor="middle">Pull request</text>
        <text class="irmeta" x="121" y="101" text-anchor="middle">Owner, context, and history</text>
      </g>
      <g transform="translate(618 166)">
        <rect class="ircard" width="242" height="128" rx="17"/>
        <circle cx="31" cy="31" r="16" fill="#1778D0"/><text x="31" y="36" text-anchor="middle" font-size="13" font-weight="760" fill="#FFFFFF">3</text>
        <circle cx="121" cy="41" r="20" fill="#EAF3FB"/><path d="M108 42l8 8 18-20M108 31h10" fill="none" stroke="#1778D0" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="irname" x="121" y="78" text-anchor="middle">Format and validate</text>
        <text class="irmeta" x="121" y="101" text-anchor="middle">Syntax, types, and modules</text>
      </g>
      <g transform="translate(898 166)">
        <rect class="ircard" width="244" height="128" rx="17"/>
        <circle cx="31" cy="31" r="16" fill="#E8790A"/><text x="31" y="36" text-anchor="middle" font-size="13" font-weight="760" fill="#FFFFFF">4</text>
        <circle cx="122" cy="41" r="20" fill="#FFF2DE"/><path d="M122 27l13 5v9c0 8-5 13-13 17-8-4-13-9-13-17v-9zM116 42l4 4 8-10" fill="none" stroke="#E8790A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="irname" x="122" y="78" text-anchor="middle">Security and policy</text>
        <text class="irmeta" x="122" y="101" text-anchor="middle">Secrets, access, and rules</text>
      </g>
    </g>
    <path d="M300 230H330M580 230H610M860 230H890" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#iacReviewBlueArrow)"/>
    <path d="M1020 294v30" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#iacReviewBlueArrow)"/>

    <text class="ircap" x="58" y="350" fill="#0E9F6E">HUMAN DECISION AND CONTROLLED DELIVERY</text>
    <g filter="url(#iacReviewShadow)">
      <g transform="translate(898 370)">
        <rect class="ircard" width="244" height="128" rx="17"/>
        <circle cx="31" cy="31" r="16" fill="#2563EB"/><text x="31" y="36" text-anchor="middle" font-size="13" font-weight="760" fill="#FFFFFF">5</text>
        <circle cx="122" cy="41" r="20" fill="#E8F2FF"/><path d="M108 32h28M108 40h20M108 48h24" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"/>
        <text class="irname" x="122" y="78" text-anchor="middle">Plan and diff review</text>
        <text class="irmeta" x="122" y="101" text-anchor="middle">Resources, access, and cost</text>
      </g>
      <g transform="translate(618 370)">
        <rect class="ircard" width="242" height="128" rx="17"/>
        <circle cx="31" cy="31" r="16" fill="#7C3AED"/><text x="31" y="36" text-anchor="middle" font-size="13" font-weight="760" fill="#FFFFFF">6</text>
        <circle cx="121" cy="41" r="20" fill="#F2EAFE"/><path d="m109 42 8 8 17-20" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="irname" x="121" y="78" text-anchor="middle">Human approval</text>
        <text class="irmeta" x="121" y="101" text-anchor="middle">Accountable decision point</text>
      </g>
      <g transform="translate(338 370)">
        <rect class="ircard" width="242" height="128" rx="17"/>
        <circle cx="31" cy="31" r="16" fill="#0E9F6E"/><text x="31" y="36" text-anchor="middle" font-size="13" font-weight="760" fill="#FFFFFF">7</text>
        <circle cx="121" cy="41" r="20" fill="#E9F8F3"/><path d="M121 28v25M111 38l10-10 10 10M108 56h26" fill="none" stroke="#0E9F6E" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="irname" x="121" y="78" text-anchor="middle">Staged deployment</text>
        <text class="irmeta" x="121" y="101" text-anchor="middle">Small scope, then expand</text>
      </g>
      <g transform="translate(58 370)">
        <rect class="ircard" width="242" height="128" rx="17"/>
        <circle cx="31" cy="31" r="16" fill="#E8790A"/><text x="31" y="36" text-anchor="middle" font-size="13" font-weight="760" fill="#FFFFFF">8</text>
        <circle cx="121" cy="41" r="20" fill="#FFF2DE"/><path d="M132 36a13 13 0 1 0 1 13M132 28v8h-8" fill="none" stroke="#E8790A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="irname" x="121" y="78" text-anchor="middle">Rollback ready</text>
        <text class="irmeta" x="121" y="101" text-anchor="middle">Validate and reverse safely</text>
      </g>
    </g>
    <path d="M898 434H868M618 434H588M338 434H308" fill="none" stroke="#0E9F6E" stroke-width="2.5" marker-end="url(#iacReviewGreenArrow)"/>

    <g transform="translate(58 530)">
      <rect width="1084" height="43" rx="13" fill="#163C63"/>
      <circle cx="24" cy="21.5" r="8" fill="#54D6B2"/>
      <path d="m20 22 3 3 6-8" fill="none" stroke="#163C63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="43" y="27" font-size="13" font-weight="680" fill="#FFFFFF">Production changes remain attributable, reviewable, tested, approved, and reversible.</text>
    </g>
  </g>
</svg>

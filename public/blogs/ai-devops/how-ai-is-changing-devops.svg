<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="aiDevopsTitle aiDevopsDesc">
  <title id="aiDevopsTitle">How AI is changing the DevOps lifecycle</title>
  <desc id="aiDevopsDesc">A five-stage DevOps lifecycle from planning through operations. AI assistance can increase drafts and change volume, while tests, policy checks, human approval, monitoring, and rollback protect quality and stability.</desc>
  <defs>
    <linearGradient id="aiDevopsBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EAF4FC"/>
    </linearGradient>
    <linearGradient id="aiDevopsBand" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#163C63"/>
      <stop offset="1" stop-color="#245D91"/>
    </linearGradient>
    <filter id="aiDevopsShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17324D" flood-opacity=".11"/>
    </filter>
    <marker id="aiDevopsArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 9 5 1 9Z" fill="#2563EB"/>
    </marker>
    <style>
      .adt{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#102A43}
      .adh{font-size:34px;font-weight:760}
      .adsub{font-size:15px;fill:#52677C}
      .adcap{font-size:11px;font-weight:760;letter-spacing:1.15px}
      .adname{font-size:16px;font-weight:740}
      .admeta{font-size:11.5px;fill:#61758A}
      .adcard{fill:#FFFFFF;stroke:#D3E1ED;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#aiDevopsBg)"/>
  <rect x="28" y="26" width="1144" height="578" rx="24" fill="none" stroke="#D7E4EF"/>
  <g class="adt">
    <text class="adh" x="58" y="70">How AI is changing the DevOps lifecycle</text>
    <text class="adsub" x="58" y="98">More assistance can create more change. Delivery controls keep that change reviewable, testable, and reversible.</text>
    <g transform="translate(936 44)">
      <rect width="206" height="36" rx="18" fill="#F2EAFE"/>
      <circle cx="19" cy="18" r="5" fill="#7C3AED"/>
      <text x="33" y="22" font-size="11" font-weight="750" fill="#6427B7">ASSISTED, NOT AUTONOMOUS</text>
    </g>

    <g transform="translate(50 125)">
      <rect width="1100" height="70" rx="18" fill="url(#aiDevopsBand)"/>
      <circle cx="37" cy="35" r="18" fill="#8B5CF6"/>
      <path d="M30 36h14M37 29v14M27 26l4 4M47 26l-4 4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="68" y="31" font-size="13" font-weight="760" letter-spacing="1" fill="#BFDFFF">AI ASSISTANCE ACROSS THE FLOW</text>
      <text x="68" y="51" font-size="13" fill="#FFFFFF">Requirements drafts  •  code suggestions  •  review summaries  •  deployment context  •  evidence synthesis</text>
    </g>

    <text class="adcap" x="58" y="228" fill="#2563EB">DELIVERY LIFECYCLE</text>
    <g filter="url(#aiDevopsShadow)">
      <g transform="translate(58 248)">
        <rect class="adcard" width="184" height="132" rx="17"/>
        <circle cx="92" cy="35" r="20" fill="#E8F2FF"/>
        <path d="M83 30h18M83 36h14M83 42h10" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"/>
        <text class="adname" x="92" y="75" text-anchor="middle">Plan</text>
        <text class="admeta" x="92" y="98" text-anchor="middle">Scope and acceptance</text>
        <text class="admeta" x="92" y="116" text-anchor="middle">criteria</text>
      </g>
      <g transform="translate(283 248)">
        <rect class="adcard" width="184" height="132" rx="17"/>
        <circle cx="92" cy="35" r="20" fill="#E9F8F3"/>
        <path d="m84 29-7 6 7 6M100 29l7 6-7 6M96 25l-8 20" fill="none" stroke="#0E9F6E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="adname" x="92" y="75" text-anchor="middle">Code</text>
        <text class="admeta" x="92" y="98" text-anchor="middle">Application and</text>
        <text class="admeta" x="92" y="116" text-anchor="middle">infrastructure changes</text>
      </g>
      <g transform="translate(508 248)">
        <rect class="adcard" width="184" height="132" rx="17"/>
        <circle cx="92" cy="35" r="20" fill="#F2EAFE"/>
        <path d="M81 35l7 7 15-17M78 50h28" fill="none" stroke="#7C3AED" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="adname" x="92" y="75" text-anchor="middle">Review</text>
        <text class="admeta" x="92" y="98" text-anchor="middle">Tests, policy, risk,</text>
        <text class="admeta" x="92" y="116" text-anchor="middle">and human judgment</text>
      </g>
      <g transform="translate(733 248)">
        <rect class="adcard" width="184" height="132" rx="17"/>
        <circle cx="92" cy="35" r="20" fill="#FFF2DE"/>
        <path d="M92 22v24M82 32l10-10 10 10M79 48h26" fill="none" stroke="#E8790A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="adname" x="92" y="75" text-anchor="middle">Deploy</text>
        <text class="admeta" x="92" y="98" text-anchor="middle">Controlled release</text>
        <text class="admeta" x="92" y="116" text-anchor="middle">and rollback readiness</text>
      </g>
      <g transform="translate(958 248)">
        <rect class="adcard" width="184" height="132" rx="17"/>
        <circle cx="92" cy="35" r="20" fill="#EAF3FB"/>
        <path d="M78 43l8-10 8 7 12-16M78 48h28" fill="none" stroke="#1778D0" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="adname" x="92" y="75" text-anchor="middle">Operate</text>
        <text class="admeta" x="92" y="98" text-anchor="middle">Signals, incidents,</text>
        <text class="admeta" x="92" y="116" text-anchor="middle">and learning</text>
      </g>
    </g>
    <path d="M242 314H275M467 314H500M692 314H725M917 314H950" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aiDevopsArrow)"/>

    <g transform="translate(58 415)">
      <rect width="516" height="148" rx="19" fill="#FFF7E8" stroke="#F1CD91"/>
      <circle cx="31" cy="30" r="15" fill="#F59E0B"/>
      <path d="M31 21v12M31 39v1" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <text class="adcap" x="56" y="34" fill="#A15305">WHAT CAN INCREASE</text>
      <g transform="translate(22 55)">
        <rect width="222" height="34" rx="10" fill="#FFFFFF"/><circle cx="17" cy="17" r="5" fill="#E8790A"/><text x="31" y="22" font-size="12" font-weight="690">Draft and change volume</text>
        <rect x="250" width="222" height="34" rx="10" fill="#FFFFFF"/><circle cx="267" cy="17" r="5" fill="#E8790A"/><text x="281" y="22" font-size="12" font-weight="690">Review and validation load</text>
        <rect y="46" width="222" height="34" rx="10" fill="#FFFFFF"/><circle cx="17" cy="63" r="5" fill="#E8790A"/><text x="31" y="68" font-size="12" font-weight="690">Pipeline and compute usage</text>
        <rect x="250" y="46" width="222" height="34" rx="10" fill="#FFFFFF"/><circle cx="267" cy="63" r="5" fill="#E8790A"/><text x="281" y="68" font-size="12" font-weight="690">Telemetry and alert volume</text>
      </g>
    </g>
    <g transform="translate(598 415)">
      <rect width="544" height="148" rx="19" fill="#ECF9F4" stroke="#B9E3D4"/>
      <circle cx="31" cy="30" r="15" fill="#0E9F6E"/>
      <path d="m24 30 5 5 9-11" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="adcap" x="56" y="34" fill="#087A55">GUARDRAILS FOR QUALITY AND STABILITY</text>
      <g transform="translate(22 55)">
        <rect width="236" height="34" rx="10" fill="#FFFFFF"/><circle cx="17" cy="17" r="5" fill="#0E9F6E"/><text x="31" y="22" font-size="12" font-weight="690">Automated tests and policy</text>
        <rect x="264" width="236" height="34" rx="10" fill="#FFFFFF"/><circle cx="281" cy="17" r="5" fill="#0E9F6E"/><text x="295" y="22" font-size="12" font-weight="690">Human approval by risk</text>
        <rect y="46" width="236" height="34" rx="10" fill="#FFFFFF"/><circle cx="17" cy="63" r="5" fill="#0E9F6E"/><text x="31" y="68" font-size="12" font-weight="690">Staged release and rollback</text>
        <rect x="264" y="46" width="236" height="34" rx="10" fill="#FFFFFF"/><circle cx="281" cy="63" r="5" fill="#0E9F6E"/><text x="295" y="68" font-size="12" font-weight="690">Monitoring and evidence</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="secureAgentTitle secureAgentDesc">
  <title id="secureAgentTitle">Securing AI coding agents in CI/CD</title>
  <desc id="secureAgentDesc">A secure delivery flow gives an AI coding agent a separate identity, routes changes through a repository pull request, executes work in an isolated CI runner with allowlisted tools and short-lived credentials, applies deterministic security gates, and requires human approval for production.</desc>
  <defs>
    <linearGradient id="secureAgentBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EAF4FC"/>
    </linearGradient>
    <linearGradient id="secureAgentRunner" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102A43"/>
      <stop offset="1" stop-color="#194C75"/>
    </linearGradient>
    <filter id="secureAgentShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17324D" flood-opacity=".11"/>
    </filter>
    <marker id="secureAgentArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 9 5 1 9Z" fill="#2563EB"/>
    </marker>
    <marker id="secureAgentGreenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 9 5 1 9Z" fill="#0E9F6E"/>
    </marker>
    <style>
      .sat{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#102A43}
      .sah{font-size:34px;font-weight:760}
      .sasub{font-size:15px;fill:#52677C}
      .sacap{font-size:11px;font-weight:760;letter-spacing:1.1px}
      .saname{font-size:15px;font-weight:740}
      .sameta{font-size:11.5px;fill:#61758A}
      .sacard{fill:#FFFFFF;stroke:#D3E1ED;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#secureAgentBg)"/>
  <rect x="28" y="26" width="1144" height="578" rx="24" fill="none" stroke="#D7E4EF"/>
  <g class="sat">
    <text class="sah" x="58" y="70">Securing AI coding agents in CI/CD</text>
    <text class="sasub" x="58" y="98">Separate identity, isolated execution, deterministic checks, and a clear production approval boundary.</text>
    <g transform="translate(941 44)">
      <rect width="201" height="36" rx="18" fill="#E9F8F3"/>
      <circle cx="19" cy="18" r="5" fill="#0E9F6E"/>
      <text x="33" y="22" font-size="11" font-weight="750" fill="#087A55">LEAST PRIVILEGE DELIVERY</text>
    </g>

    <text class="sacap" x="58" y="145" fill="#2563EB">CONTROLLED CHANGE PATH</text>
    <g filter="url(#secureAgentShadow)">
      <g transform="translate(58 171)">
        <rect class="sacard" width="190" height="142" rx="18"/>
        <circle cx="95" cy="39" r="23" fill="#F2EAFE"/>
        <circle cx="95" cy="35" r="7" fill="none" stroke="#7C3AED" stroke-width="2"/>
        <path d="M82 54c3-8 9-11 13-11s10 3 13 11M78 31h7M105 31h7" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
        <text class="saname" x="95" y="81" text-anchor="middle">Agent identity</text>
        <text class="sameta" x="95" y="104" text-anchor="middle">Separate from human</text>
        <text class="sameta" x="95" y="122" text-anchor="middle">accounts</text>
      </g>
      <g transform="translate(286 171)">
        <rect class="sacard" width="190" height="142" rx="18"/>
        <circle cx="95" cy="39" r="23" fill="#E8F2FF"/>
        <path d="M82 30h26v20H82zM87 25h16v5M88 37h14M88 43h10" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
        <text class="saname" x="95" y="81" text-anchor="middle">Repository and PR</text>
        <text class="sameta" x="95" y="104" text-anchor="middle">Visible diff, owner,</text>
        <text class="sameta" x="95" y="122" text-anchor="middle">and review history</text>
      </g>
    </g>
    <path d="M248 242H278" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#secureAgentArrow)"/>

    <g transform="translate(514 145)" filter="url(#secureAgentShadow)">
      <rect width="322" height="194" rx="21" fill="url(#secureAgentRunner)"/>
      <rect x="18" y="17" width="286" height="160" rx="15" fill="#FFFFFF" fill-opacity=".08" stroke="#79A7CF" stroke-dasharray="6 5"/>
      <circle cx="46" cy="48" r="18" fill="#2D6ED6"/>
      <path d="M36 48h20M46 38v20M39 41l14 14M53 41 39 55" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <text x="76" y="44" font-size="16" font-weight="750" fill="#FFFFFF">Isolated CI runner</text>
      <text x="76" y="63" font-size="11.5" fill="#C9DBEB">Fresh execution boundary</text>
      <g transform="translate(26 87)">
        <rect width="126" height="62" rx="12" fill="#FFFFFF"/>
        <path d="M13 19h16M13 27h12M13 35h16" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
        <text x="36" y="25" font-size="11.5" font-weight="730">Allowlisted tools</text>
        <text x="13" y="48" font-size="9.8" fill="#61758A">Approved actions only</text>
      </g>
      <g transform="translate(168 87)">
        <rect width="128" height="62" rx="12" fill="#FFFFFF"/>
        <circle cx="19" cy="25" r="8" fill="none" stroke="#0E9F6E" stroke-width="2"/>
        <path d="M25 31l7 7M14 25h9" stroke="#0E9F6E" stroke-width="2" stroke-linecap="round"/>
        <text x="36" y="22" font-size="11" font-weight="730">Short-lived</text>
        <text x="36" y="36" font-size="11" font-weight="730">credentials</text>
        <text x="13" y="51" font-size="9.8" fill="#61758A">Scoped access</text>
      </g>
    </g>
    <path d="M476 242H506M836 242H866" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#secureAgentArrow)"/>

    <g transform="translate(874 171)" filter="url(#secureAgentShadow)">
      <rect class="sacard" width="268" height="142" rx="18"/>
      <text class="sacap" x="134" y="27" text-anchor="middle" fill="#E8790A">DETERMINISTIC GATES</text>
      <g transform="translate(18 43)">
        <rect width="110" height="34" rx="10" fill="#E9F8F3"/><circle cx="17" cy="17" r="5" fill="#0E9F6E"/><text x="30" y="21" font-size="11.5" font-weight="690">Tests</text>
        <rect x="122" width="110" height="34" rx="10" fill="#FFF2DE"/><circle cx="139" cy="17" r="5" fill="#E8790A"/><text x="152" y="21" font-size="11.5" font-weight="690">Secret scan</text>
        <rect y="45" width="110" height="34" rx="10" fill="#E8F2FF"/><circle cx="17" cy="62" r="5" fill="#2563EB"/><text x="30" y="66" font-size="11.5" font-weight="690">Policy</text>
        <rect x="122" y="45" width="110" height="34" rx="10" fill="#F2EAFE"/><circle cx="139" cy="62" r="5" fill="#7C3AED"/><text x="152" y="66" font-size="11.5" font-weight="690">IaC checks</text>
      </g>
    </g>

    <path d="M1008 313v43" fill="none" stroke="#0E9F6E" stroke-width="2.5" marker-end="url(#secureAgentGreenArrow)"/>
    <g transform="translate(874 364)" filter="url(#secureAgentShadow)">
      <rect width="268" height="126" rx="19" fill="#ECF9F4" stroke="#B9E3D4" stroke-width="1.5"/>
      <circle cx="50" cy="63" r="26" fill="#0E9F6E"/>
      <path d="m38 63 8 8 17-22" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="saname" x="88" y="54">Human production</text>
      <text class="saname" x="88" y="75">approval</text>
      <text class="sameta" x="88" y="97">Explicit release boundary</text>
    </g>

    <g transform="translate(58 373)">
      <rect width="778" height="117" rx="19" fill="#FFFFFF" stroke="#D3E1ED"/>
      <text class="sacap" x="22" y="30" fill="#52677C">CONTROL INTENT</text>
      <g transform="translate(22 49)">
        <rect width="223" height="45" rx="12" fill="#F2EAFE"/>
        <circle cx="20" cy="22.5" r="8" fill="#7C3AED"/><text x="38" y="20" font-size="12" font-weight="720">Scoped identity</text><text x="38" y="35" font-size="10.5" fill="#61758A">Attributable activity</text>
        <rect x="255" width="223" height="45" rx="12" fill="#E8F2FF"/>
        <circle cx="275" cy="22.5" r="8" fill="#2563EB"/><text x="293" y="20" font-size="12" font-weight="720">Controlled execution</text><text x="293" y="35" font-size="10.5" fill="#61758A">Limited tools and access</text>
        <rect x="510" width="223" height="45" rx="12" fill="#E9F8F3"/>
        <circle cx="530" cy="22.5" r="8" fill="#0E9F6E"/><text x="548" y="20" font-size="12" font-weight="720">Approval boundary</text><text x="548" y="35" font-size="10.5" fill="#61758A">People authorize production</text>
      </g>
    </g>

    <g transform="translate(58 530)">
      <rect width="1084" height="43" rx="13" fill="#163C63"/>
      <circle cx="24" cy="21.5" r="8" fill="#54D6B2"/>
      <path d="m20 22 3 3 6-8" fill="none" stroke="#163C63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="43" y="27" font-size="13" font-weight="680" fill="#FFFFFF">The agent proposes changes. The delivery system enforces policy. A person approves production.</text>
    </g>
  </g>
</svg>

      .dsub { font-size: 15px; fill: #52677C; }
      .dsection { font-size: 13px; font-weight: 760; letter-spacing: 1.2px; }
      .dname { font-size: 15px; font-weight: 730; }
      .dmeta { font-size: 12px; fill: #61758A; }
      .dcard { fill: #FFFFFF; stroke: #D8E5F1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#devsecBg)"/>

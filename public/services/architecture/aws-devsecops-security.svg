<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="devsecTitle devsecDesc">
  <title id="devsecTitle">AWS security hardening with DevSecOps</title>
  <desc id="devsecDesc">A GitLab pipeline builds and tests application code, applies SonarQube code analysis, builds a Docker image, and scans it with Trivy before release. Engineers use AWS VPN and least privilege IAM access to reach workloads inside a private VPC. AWS Secrets Manager provides managed secrets, while GuardDuty and CloudWatch security logs support continuous detection and alerting.</desc>
  <defs>
    <linearGradient id="devsecBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#F1F7FC"/>
    </linearGradient>
    <linearGradient id="devsecWorkload" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143D63"/>
      <stop offset="1" stop-color="#0D263F"/>
    </linearGradient>
    <filter id="devsecShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#17324D" flood-opacity="0.10"/>
    </filter>
    <marker id="devsecArrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 9 5 1 9Z" fill="#2563EB"/>
    </marker>
    <marker id="devsecArrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 9 5 1 9Z" fill="#7C3AED"/>
    </marker>
    <marker id="devsecArrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 9 5 1 9Z" fill="#0E9F6E"/>
    </marker>
    <style>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="cisTitle cisDesc">
  <title id="cisTitle">CIS Kubernetes Benchmark assessment across EKS and LKE</title>
  <desc id="cisDesc">Amazon EKS and Linode LKE environments feed a control-by-control CIS Kubernetes Benchmark assessment. Managed control plane controls are mapped to provider responsibility, while workloads, role-based access control, network policies, and nodes are reviewed as customer responsibilities. kube-bench output and manual review form the evidence set, producing documented findings and remediation priorities without a certification or pass claim.</desc>
  <defs>
    <linearGradient id="cisBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF6FC"/></linearGradient>
    <filter id="cisShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17324D" flood-opacity=".1"/></filter>
    <marker id="cisArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#2563EB"/></marker>
    <style>.ct{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#102A43}.ch{font-size:30px;font-weight:760}.csub{font-size:15px;fill:#52677C}.ccap{font-size:12px;font-weight:760;letter-spacing:1px}.cname{font-size:15px;font-weight:730}.cmeta{font-size:11px;fill:#61758A}.ccard{fill:#fff;stroke:#D8E5F1;stroke-width:1.5}</style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#cisBg)"/><rect x="28" y="26" width="1144" height="668" rx="24" fill="none" stroke="#D9E6F2"/>
  <g class="ct">
    <text class="ch" x="58" y="72">CIS Kubernetes assessment across managed platforms</text>
    <text class="csub" x="58" y="99">Responsibility mapping, configuration review, and evidence for Amazon EKS and Linode LKE</text>
    <g transform="translate(904 43)"><rect width="238" height="36" rx="18" fill="#FFF2DE"/><circle cx="18" cy="18" r="5" fill="#E8790A"/><text x="31" y="22" font-size="10.5" font-weight="750" fill="#A15305">ASSESSMENT, NOT CERTIFICATION</text></g>

    <text class="ccap" x="58" y="150" fill="#2563EB">ENVIRONMENTS IN SCOPE</text>
    <g filter="url(#cisShadow)">
      <g transform="translate(58 168)"><rect class="ccard" width="238" height="90" rx="16"/><circle cx="46" cy="45" r="25" fill="#E8F2FF"/><path d="M46 28v34M29 45h34M34 33l24 24M58 33 34 57" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"/><circle cx="46" cy="45" r="10" fill="none" stroke="#2563EB" stroke-width="2.2"/><text class="cname" x="85" y="40">Amazon EKS</text><text class="cmeta" x="85" y="60">Managed Kubernetes</text></g>
      <g transform="translate(326 168)"><rect class="ccard" width="238" height="90" rx="16"/><circle cx="46" cy="45" r="25" fill="#E9F8F3"/><path d="M35 55V36l11-7 11 7v19l-11 7zM35 36l11 7 11-7M46 43v19" fill="none" stroke="#0E9F6E" stroke-width="2.2"/><text class="cname" x="85" y="40">Linode LKE</text><text class="cmeta" x="85" y="60">Managed Kubernetes</text></g>
    </g>
    <path d="M177 258v22h420v-75h25" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#cisArrow)"/>
    <path d="M564 220h58" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#cisArrow)"/>
    <g transform="translate(630 158)" filter="url(#cisShadow)"><rect width="310" height="110" rx="17" fill="#102A43"/><text x="155" y="30" text-anchor="middle" font-size="12" font-weight="760" letter-spacing="1" fill="#A9D5FF">CONTROL REGISTER</text><text x="155" y="60" text-anchor="middle" font-size="17" font-weight="740" fill="#fff">CIS Kubernetes Benchmark</text><text x="155" y="83" text-anchor="middle" font-size="11" fill="#C9DBEB">Control-by-control scope and responsibility</text></g>
    <path d="M940 213H975" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#cisArrow)"/>
    <g transform="translate(985 168)"><rect width="157" height="90" rx="16" fill="#F2EAFE" stroke="#D1B8F5"/><text class="ccap" x="78" y="28" text-anchor="middle" fill="#6427B7">ASSESSMENT</text><text class="cmeta" x="78" y="51" text-anchor="middle">Responsibility</text><text class="cmeta" x="78" y="68" text-anchor="middle">Evidence and note</text></g>

    <rect x="48" y="298" width="1104" height="238" rx="20" fill="#fff" stroke="#D8E5F1"/>
    <text class="ccap" x="70" y="329" fill="#52677C">SHARED-RESPONSIBILITY REVIEW</text>
    <g transform="translate(70 350)">
      <rect width="364" height="158" rx="17" fill="#EAF3FB" stroke="#BCD2E6"/>
      <text class="ccap" x="20" y="28" fill="#174D75">MANAGED PROVIDER RESPONSIBILITY</text>
      <g transform="translate(20 47)"><rect width="324" height="42" rx="11" fill="#fff"/><circle cx="20" cy="21" r="7" fill="#2563EB"/><text class="cname" x="39" y="26">Control plane configuration</text></g>
      <g transform="translate(20 98)"><rect width="324" height="42" rx="11" fill="#fff"/><circle cx="20" cy="21" r="7" fill="#2563EB"/><text class="cname" x="39" y="26">Provider responsibility statement</text></g>
    </g>
    <g transform="translate(458 350)">
      <rect width="672" height="158" rx="17" fill="#F0FAF7" stroke="#B9E3D4"/>
      <text class="ccap" x="20" y="28" fill="#087A55">CUSTOMER-MANAGED RESPONSIBILITY</text>
      <g transform="translate(20 47)"><rect width="147" height="91" rx="12" fill="#fff"/><circle cx="73" cy="27" r="10" fill="#0E9F6E"/><text class="cname" x="73" y="57" text-anchor="middle">Workloads</text><text class="cmeta" x="73" y="77" text-anchor="middle">Pod settings</text></g>
      <g transform="translate(181 47)"><rect width="147" height="91" rx="12" fill="#fff"/><circle cx="73" cy="27" r="10" fill="#0E9F6E"/><text class="cname" x="73" y="57" text-anchor="middle">RBAC</text><text class="cmeta" x="73" y="77" text-anchor="middle">Access scope</text></g>
      <g transform="translate(342 47)"><rect width="147" height="91" rx="12" fill="#fff"/><circle cx="73" cy="27" r="10" fill="#0E9F6E"/><text class="cname" x="73" y="57" text-anchor="middle">Networks</text><text class="cmeta" x="73" y="77" text-anchor="middle">Traffic policy</text></g>
      <g transform="translate(503 47)"><rect width="147" height="91" rx="12" fill="#fff"/><circle cx="73" cy="27" r="10" fill="#0E9F6E"/><text class="cname" x="73" y="57" text-anchor="middle">Nodes</text><text class="cmeta" x="73" y="77" text-anchor="middle">Host settings</text></g>
    </g>

    <text class="ccap" x="58" y="578" fill="#7C3AED">EVIDENCE AND OUTPUT</text>
    <g transform="translate(58 596)" filter="url(#cisShadow)"><rect class="ccard" width="226" height="68" rx="14"/><text class="cname" x="113" y="29" text-anchor="middle">kube-bench output</text><text class="cmeta" x="113" y="49" text-anchor="middle">Available technical checks</text></g>
    <g transform="translate(314 596)" filter="url(#cisShadow)"><rect class="ccard" width="226" height="68" rx="14"/><text class="cname" x="113" y="29" text-anchor="middle">Manual review</text><text class="cmeta" x="113" y="49" text-anchor="middle">Context and responsibility</text></g>
    <path d="M284 630H306M540 630H580" fill="none" stroke="#7C3AED" stroke-width="2.3" marker-end="url(#cisArrow)"/>
    <g transform="translate(590 583)">
      <rect width="552" height="94" rx="17" fill="#F2EAFE" stroke="#D1B8F5"/>
      <text class="ccap" x="20" y="26" fill="#6427B7">DOCUMENTED ASSESSMENT</text>
      <g transform="translate(20 40)"><rect width="157" height="34" rx="17" fill="#fff"/><text x="78" y="22" text-anchor="middle" font-size="10.5" font-weight="720" fill="#6427B7">RESPONSIBILITY</text></g>
      <g transform="translate(187 40)"><rect width="157" height="34" rx="17" fill="#fff"/><text x="78" y="22" text-anchor="middle" font-size="10.5" font-weight="720" fill="#6427B7">EVIDENCE NOTE</text></g>
      <g transform="translate(354 40)"><rect width="178" height="34" rx="17" fill="#fff"/><text x="89" y="22" text-anchor="middle" font-size="10.5" font-weight="720" fill="#6427B7">FOLLOW-UP PRIORITY</text></g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="previewTitle previewDesc">
  <title id="previewTitle">Amazon ECS pull request preview environment workflow</title>
  <desc id="previewDesc">A GitHub pull request starts GitHub Actions, which builds a Docker image in Amazon ECR and creates an isolated ECS preview service with a unique test URL. New commits update the preview, closing the pull request removes its resources, and merging promotes a tested image to a production ECS service with health checks and rollback.</desc>
  <defs><linearGradient id="prBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF6FC"/></linearGradient><filter id="prShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324D" flood-opacity=".1"/></filter><marker id="prArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#2563EB"/></marker><marker id="prGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#0E9F6E"/></marker><style>.t{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#102A43}.h{font-size:30px;font-weight:760}.sub{font-size:15px;fill:#52677C}.cap{font-size:12px;font-weight:760;letter-spacing:1px}.name{font-size:14px;font-weight:730}.meta{font-size:11px;fill:#61758A}.card{fill:#fff;stroke:#D8E5F1;stroke-width:1.5}</style></defs>
  <rect width="1200" height="720" rx="28" fill="url(#prBg)"/><rect x="28" y="26" width="1144" height="668" rx="24" fill="none" stroke="#D9E6F2"/>
  <g class="t"><text class="h" x="58" y="72">Pull request preview environments on Amazon ECS</text><text class="sub" x="58" y="99">Build, provision, test, update, promote, and remove each isolated environment through automation</text><g transform="translate(939 45)"><rect width="203" height="32" rx="16" fill="#E9F8F3"/><text x="102" y="21" text-anchor="middle" font-size="11" font-weight="750" fill="#087A55">EPHEMERAL BY DEFAULT</text></g>
    <text class="cap" x="58" y="151" fill="#7C3AED">PULL REQUEST OPENS</text><g filter="url(#prShadow)"><g transform="translate(58 170)"><rect class="card" width="170" height="64" rx="13"/><text class="name" x="85" y="29" text-anchor="middle">GitHub pull request</text><text class="meta" x="85" y="48" text-anchor="middle">Feature branch</text></g><g transform="translate(280 170)"><rect width="180" height="64" rx="13" fill="#F2EAFE" stroke="#D1B8F5"/><text class="name" x="90" y="29" text-anchor="middle" fill="#6427B7">GitHub Actions</text><text class="meta" x="90" y="48" text-anchor="middle">Build and test</text></g><g transform="translate(512 170)"><rect width="180" height="64" rx="13" fill="#FFF8EE" stroke="#F4CCA0"/><text class="name" x="90" y="29" text-anchor="middle" fill="#A15305">Amazon ECR</text><text class="meta" x="90" y="48" text-anchor="middle">PR image tag</text></g><g transform="translate(744 170)"><rect width="190" height="64" rx="13" fill="#E8F2FF" stroke="#B9D4F4"/><text class="name" x="95" y="29" text-anchor="middle" fill="#174EA6">ECS preview service</text><text class="meta" x="95" y="48" text-anchor="middle">Isolated tasks</text></g><g transform="translate(986 170)"><rect width="156" height="64" rx="13" fill="#F0FAF7" stroke="#B9E3D4"/><text class="name" x="78" y="29" text-anchor="middle" fill="#087A55">Unique URL</text><text class="meta" x="78" y="48" text-anchor="middle">QA review</text></g></g><path d="M228 202H272M460 202H504M692 202H736M934 202H978" fill="none" stroke="#7C3AED" stroke-width="2.3" marker-end="url(#prArrow)"/>
    <rect x="48" y="274" width="1104" height="130" rx="18" fill="#fff" stroke="#D8E5F1"/><text class="cap" x="70" y="301" fill="#52677C">PULL REQUEST LIFECYCLE</text><g transform="translate(70 321)"><rect width="300" height="60" rx="13" fill="#E8F2FF"/><text class="name" x="150" y="26" text-anchor="middle" fill="#174EA6">New commit</text><text class="meta" x="150" y="45" text-anchor="middle">Rebuild and update preview</text></g><g transform="translate(450 321)"><rect width="300" height="60" rx="13" fill="#F0FAF7"/><text class="name" x="150" y="26" text-anchor="middle" fill="#087A55">Pull request approved</text><text class="meta" x="150" y="45" text-anchor="middle">Merge tested change</text></g><g transform="translate(830 321)"><rect width="300" height="60" rx="13" fill="#FDECEF"/><text class="name" x="150" y="26" text-anchor="middle" fill="#A5123B">Pull request closes</text><text class="meta" x="150" y="45" text-anchor="middle">Remove preview resources</text></g>
    <g transform="translate(48 438)"><rect width="739" height="194" rx="20" fill="#fff" stroke="#AFC8DF" stroke-width="1.5"/><rect width="739" height="40" rx="20" fill="#EAF3FB"/><path d="M0 20C0 9 9 0 20 0h699c11 0 20 9 20 20v20H0z" fill="#EAF3FB"/><text class="cap" x="22" y="26" fill="#174D75">PRODUCTION PROMOTION</text><g transform="translate(22 65)"><rect width="180" height="94" rx="14" fill="#F2EAFE"/><text class="name" x="90" y="34" text-anchor="middle" fill="#6427B7">Merge to main</text><text class="meta" x="90" y="56" text-anchor="middle">Production image</text><text class="meta" x="90" y="74" text-anchor="middle">Task definition update</text></g><g transform="translate(270 65)"><rect width="200" height="94" rx="14" fill="#12385C"/><text x="100" y="34" text-anchor="middle" font-size="14" font-weight="730" fill="#fff">Production ECS</text><text x="100" y="56" text-anchor="middle" font-size="11" fill="#C9DBEB">Private Fargate tasks</text><text x="100" y="74" text-anchor="middle" font-size="11" fill="#C9DBEB">Multiple Availability Zones</text></g><g transform="translate(538 65)"><rect width="179" height="94" rx="14" fill="#F0FAF7"/><text class="name" x="90" y="34" text-anchor="middle" fill="#087A55">Health gates</text><text class="meta" x="90" y="56" text-anchor="middle">Rolling update</text><text class="meta" x="90" y="74" text-anchor="middle">Automatic rollback</text></g><path d="M202 112H262M470 112H530" fill="none" stroke="#0E9F6E" stroke-width="2.3" marker-end="url(#prGreen)"/></g>
    <g transform="translate(811 438)"><rect width="341" height="194" rx="20" fill="#102A43"/><text x="20" y="34" font-size="12" font-weight="760" letter-spacing="1" fill="#A9D5FF">SHARED AWS FOUNDATION</text><g transform="translate(18 58)"><rect width="145" height="54" rx="11" fill="#fff" fill-opacity=".1"/><text x="73" y="24" text-anchor="middle" font-size="12" font-weight="730" fill="#fff">Terraform</text><text x="73" y="42" text-anchor="middle" font-size="10" fill="#C9DBEB">VPC and ECS</text></g><g transform="translate(178 58)"><rect width="145" height="54" rx="11" fill="#fff" fill-opacity=".1"/><text x="73" y="24" text-anchor="middle" font-size="12" font-weight="730" fill="#fff">WAF and ALB</text><text x="73" y="42" text-anchor="middle" font-size="10" fill="#C9DBEB">Protected routing</text></g><g transform="translate(18 126)"><rect width="305" height="45" rx="11" fill="#fff" fill-opacity=".1"/><text x="153" y="28" text-anchor="middle" font-size="12" font-weight="730" fill="#fff">Prometheus and Grafana observability</text></g></g>
  </g>
</svg>

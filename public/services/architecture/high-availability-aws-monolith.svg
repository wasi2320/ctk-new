<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="monoTitle monoDesc">
  <title id="monoTitle">Highly available monolithic application architecture on AWS</title>
  <desc id="monoDesc">Users reach Route 53, CloudFront, AWS WAF, and an Application Load Balancer. Elastic Beanstalk runs the monolithic application across two Availability Zones with automatic scaling. Amazon RDS uses a Multi-AZ standby, while CloudWatch, AWS Backup, KMS, and a delivery pipeline support operations and resilience.</desc>
  <defs>
    <linearGradient id="monoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#F4F8FC"/>
    </linearGradient>
    <linearGradient id="monoApp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163A5F"/>
      <stop offset="1" stop-color="#0F2740"/>
    </linearGradient>
    <filter id="monoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#17324D" flood-opacity="0.10"/>
    </filter>
    <marker id="monoArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 9 5 1 9Z" fill="#2563EB"/>
    </marker>
    <marker id="monoArrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 9 5 1 9Z" fill="#0E9F6E"/>
    </marker>
    <style>
      .mt { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #102A43; }
      .mtitle { font-size: 30px; font-weight: 760; letter-spacing: -0.5px; }
      .msub { font-size: 15px; fill: #52677C; }
      .msection { font-size: 13px; font-weight: 760; letter-spacing: 1.2px; }
      .mname { font-size: 16px; font-weight: 730; }
      .mmeta { font-size: 12.5px; fill: #61758A; }
      .mcard { fill: #FFFFFF; stroke: #D8E5F1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#monoBg)"/>
  <rect x="28" y="26" width="1144" height="668" rx="24" fill="none" stroke="#D9E6F2"/>

  <g class="mt">
    <text class="mtitle" x="58" y="72">Highly available AWS monolith</text>
    <text class="msub" x="58" y="99">One application, resilient infrastructure, automated scaling, and managed recovery</text>

    <g transform="translate(986 46)">
      <rect width="156" height="30" rx="15" fill="#E9F8F3"/>
      <circle cx="17" cy="15" r="5" fill="#0E9F6E"/>
      <text x="30" y="19" font-size="11" font-weight="750" fill="#087A55">MULTI-AZ DESIGN</text>
    </g>

    <text class="msection" x="58" y="145" fill="#2563EB">REQUEST PATH</text>
    <g filter="url(#monoShadow)">
      <g transform="translate(58 164)">
        <rect class="mcard" width="158" height="86" rx="15"/>
        <circle cx="33" cy="34" r="18" fill="#E8F2FF"/>
        <circle cx="33" cy="29" r="6" fill="none" stroke="#2563EB" stroke-width="2.2"/>
        <path d="M22 43c2-6 6-9 11-9s9 3 11 9" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"/>
        <text class="mname" x="60" y="33">Users</text>
        <text class="mmeta" x="60" y="54">HTTPS requests</text>
      </g>
      <g transform="translate(265 164)">
        <rect class="mcard" width="158" height="86" rx="15"/>
        <circle cx="33" cy="34" r="18" fill="#F2EAFE"/>
        <path d="M25 40h16M25 34h16M25 28h16M33 25v18" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
        <text class="mname" x="60" y="33">Route 53</text>
        <text class="mmeta" x="60" y="54">DNS and health</text>
      </g>
      <g transform="translate(472 164)">
        <rect class="mcard" width="190" height="86" rx="15"/>
        <circle cx="33" cy="34" r="18" fill="#FFF0E8"/>
        <path d="M33 23 43 27v8c0 7-4 11-10 14-6-3-10-7-10-14v-8z" fill="none" stroke="#E95C17" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="m28 35 4 4 7-9" fill="none" stroke="#E95C17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="mname" x="60" y="33">CloudFront + WAF</text>
        <text class="mmeta" x="60" y="54">Edge cache and filter</text>
      </g>
      <g transform="translate(711 164)">

        <circle cx="33" cy="34" r="18" fill="#FFF2DE"/>
        <path d="M24 27h18v14H24zM27 30h12M27 34h12M27 38h8" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
        <text class="mname" x="60" y="33">Cognito</text>
        <text class="mmeta" x="60" y="54">User authentication</text>
      </g>
    </g>
    <path d="M216 207H257" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#monoArrow)"/>
    <path d="M423 207H464" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#monoArrow)"/>
    <path d="M662 207H703" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#monoArrow)"/>

      <text x="246" y="170" text-anchor="middle" font-size="12" font-weight="720" fill="#6427B7">KMS keys</text>
    </g>

    <path d="M806 250v95c0 18-17 30-42 30H606v6" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#monoArrow)"/>
    <path d="M806 250v95c0 18-17 30-42 30H267v6" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#monoArrow)"/>
    <path d="M406 447H423" fill="none" stroke="#0E9F6E" stroke-width="2.2" stroke-dasharray="5 5" marker-end="url(#monoArrowGreen)"/>
    <text x="414" y="434" text-anchor="middle" font-size="10" font-weight="700" fill="#087A55">SCALE</text>
    <path d="M746 447H784" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#monoArrow)"/>

    <g transform="translate(70 555)">

      <rect x="37" y="64" width="34" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.14"/>
      <path d="M45 74h18M45 80h18M45 86h12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="83" y="76" font-size="15" font-weight="730" fill="#FFFFFF">Monolith instance</text>
      <text x="83" y="96" font-size="12" fill="#C9DBEB">Private app subnet</text>
    </g>
    <g transform="translate(431 381)">
      <rect width="315" height="130" rx="15" fill="#FFFFFF" stroke="#B9D0E4"/>
      <rect width="315" height="32" rx="15" fill="#E8F2FF"/>
      <path d="M0 17C0 8 8 0 17 0h281c9 0 17 8 17 17v15H0z" fill="#E8F2FF"/>
      <circle cx="18" cy="16" r="5" fill="#2563EB"/>
      <text x="30" y="21" font-size="12" font-weight="750" fill="#174EA6">AVAILABILITY ZONE B</text>
      <rect x="20" y="49" width="275" height="62" rx="12" fill="url(#monoApp)"/>
      <rect x="37" y="64" width="34" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.14"/>
      <path d="M45 74h18M45 80h18M45 86h12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="83" y="76" font-size="15" font-weight="730" fill="#FFFFFF">Monolith instance</text>
      <text x="83" y="96" font-size="12" fill="#C9DBEB">Private app subnet</text>
    </g>

    <g transform="translate(792 336)">
      <rect width="338" height="198" rx="17" fill="#F8FBFF" stroke="#BCD2E6"/>
      <text x="20" y="28" font-size="13" font-weight="760" letter-spacing="1.1" fill="#52677C">MANAGED DATA TIER</text>
      <rect x="20" y="46" width="298" height="90" rx="14" fill="#FFFFFF" stroke="#D8E5F1"/>
      <circle cx="54" cy="78" r="20" fill="#F2EAFE"/>

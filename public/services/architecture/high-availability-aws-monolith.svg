      </g>
      <g transform="translate(598 15)">
        <rect width="169" height="46" rx="12" fill="#FFFFFF" stroke="#D8E5F1"/>
        <circle cx="24" cy="23" r="10" fill="#2563EB"/>
        <path d="M19 18h10v10H19z" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>

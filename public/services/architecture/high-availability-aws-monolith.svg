    <rect x="48" y="278" width="1104" height="376" rx="20" fill="#FFFFFF" stroke="#AFC8DF" stroke-width="1.5"/>
    <rect x="48" y="278" width="1104" height="38" rx="20" fill="#EAF3FB"/>
    <path d="M48 298c0-11 9-20 20-20h1064c11 0 20 9 20 20v18H48z" fill="#EAF3FB"/>
    <text class="msection" x="70" y="302" fill="#174D75">AWS REGION  •  PRIVATE VPC</text>
    <text class="mmeta" x="1036" y="302">10.0.0.0/16</text>

    <rect x="70" y="336" width="697" height="198" rx="17" fill="#F8FBFF" stroke="#BCD2E6" stroke-dasharray="7 6"/>

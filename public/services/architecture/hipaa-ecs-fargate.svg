<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="hipaaTitle hipaaDesc">
  <title id="hipaaTitle">HIPAA hardened healthcare analytics platform on AWS</title>
  <desc id="hipaaDesc">Patient portal traffic uses end-to-end TLS through an Application Load Balancer to ECS Fargate services in private subnets across two Availability Zones. Aurora PostgreSQL provides encrypted managed data, with Secrets Manager, controlled NAT egress, logging, backups, and monitoring supporting protected health information workloads.</desc>
  <defs><linearGradient id="hBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF6FC"/></linearGradient><filter id="hShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324D" flood-opacity=".1"/></filter><marker id="hArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#2563EB"/></marker><style>.t{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#102A43}.h{font-size:30px;font-weight:760}.sub{font-size:15px;fill:#52677C}.cap{font-size:12px;font-weight:760;letter-spacing:1px}.name{font-size:15px;font-weight:730}.meta{font-size:11px;fill:#61758A}.card{fill:#fff;stroke:#D8E5F1;stroke-width:1.5}</style></defs>
  <rect width="1200" height="720" rx="28" fill="url(#hBg)"/><rect x="28" y="26" width="1144" height="668" rx="24" fill="none" stroke="#D9E6F2"/>
  <g class="t"><text class="h" x="58" y="72">HIPAA hardened analytics platform on AWS</text><text class="sub" x="58" y="99">Private application and data services with encrypted transport, managed credentials, and controlled egress</text><g transform="translate(932 45)"><rect width="210" height="32" rx="16" fill="#E9F8F3"/><text x="105" y="21" text-anchor="middle" font-size="11" font-weight="750" fill="#087A55">PROTECTED DATA PATH</text></g>
    <text class="cap" x="58" y="151" fill="#2563EB">END-TO-END TLS</text><g filter="url(#hShadow)"><g transform="translate(58 170)"><rect class="card" width="180" height="64" rx="13"/><text class="name" x="90" y="29" text-anchor="middle">Patient portal</text><text class="meta" x="90" y="48" text-anchor="middle">HTTPS request</text></g><g transform="translate(300 170)"><rect class="card" width="190" height="64" rx="13"/><text class="name" x="95" y="29" text-anchor="middle">AWS ACM</text><text class="meta" x="95" y="48" text-anchor="middle">Managed certificates</text></g><g transform="translate(552 170)"><rect width="230" height="64" rx="13" fill="#F0FAF7" stroke="#B9E3D4"/><text class="name" x="115" y="29" text-anchor="middle" fill="#087A55">Application Load Balancer</text><text class="meta" x="115" y="48" text-anchor="middle">TLS to private services</text></g></g><path d="M238 202H292M490 202H544" fill="none" stroke="#2563EB" stroke-width="2.3" marker-end="url(#hArrow)"/>
    <rect x="48" y="272" width="805" height="360" rx="20" fill="#fff" stroke="#AFC8DF" stroke-width="1.5"/><rect x="48" y="272" width="805" height="40" rx="20" fill="#EAF3FB"/><path d="M48 292c0-11 9-20 20-20h765c11 0 20 9 20 20v20H48z" fill="#EAF3FB"/><text class="cap" x="70" y="297" fill="#174D75">AWS REGION  •  PRIVATE SUBNETS</text>
    <g transform="translate(70 335)"><rect width="365" height="120" rx="16" fill="#F8FBFF" stroke="#BCD2E6"/><text class="cap" x="18" y="27" fill="#52677C">AVAILABILITY ZONE A</text><rect x="18" y="45" width="329" height="52" rx="11" fill="#12385C"/><text x="165" y="68" text-anchor="middle" font-size="14" font-weight="730" fill="#fff">ECS Fargate  •  Node.js and Prisma</text><text x="165" y="86" text-anchor="middle" font-size="10.5" fill="#C9DBEB">No direct inbound internet access</text></g><g transform="translate(466 335)"><rect width="365" height="120" rx="16" fill="#F8FBFF" stroke="#BCD2E6"/><text class="cap" x="18" y="27" fill="#52677C">AVAILABILITY ZONE B</text><rect x="18" y="45" width="329" height="52" rx="11" fill="#12385C"/><text x="165" y="68" text-anchor="middle" font-size="14" font-weight="730" fill="#fff">ECS Fargate  •  Node.js and Prisma</text><text x="165" y="86" text-anchor="middle" font-size="10.5" fill="#C9DBEB">Service failover capacity</text></g>
    <g transform="translate(70 485)"><rect width="497" height="118" rx="16" fill="#F2EAFE" stroke="#D1B8F5"/><text class="cap" x="18" y="28" fill="#6427B7">MANAGED DATA</text><ellipse cx="54" cy="67" rx="19" ry="8" fill="none" stroke="#7C3AED" stroke-width="2"/><path d="M35 67v24c0 10 38 10 38 0V67M35 79c0 10 38 10 38 0" fill="none" stroke="#7C3AED" stroke-width="2"/><text class="name" x="94" y="65" fill="#6427B7">Aurora PostgreSQL</text><text class="meta" x="94" y="86">Encrypted storage, backups, and managed failover</text></g><g transform="translate(588 485)"><rect width="243" height="118" rx="16" fill="#FFF8EE" stroke="#F4CCA0"/><text class="cap" x="18" y="28" fill="#A15305">CONTROLLED EGRESS</text><text class="name" x="18" y="60" fill="#A15305">Regional NAT gateways</text><text class="meta" x="18" y="82">Private service updates</text><text class="meta" x="18" y="99">Resilient outbound access</text></g>
    <g transform="translate(881 151)"><rect width="261" height="481" rx="20" fill="#102A43"/><text x="20" y="34" font-size="12" font-weight="760" letter-spacing="1" fill="#A9D5FF">TECHNICAL SAFEGUARDS</text><g transform="translate(18 61)"><rect width="225" height="76" rx="13" fill="#fff" fill-opacity=".1"/><text x="17" y="29" font-size="14" font-weight="730" fill="#fff">AWS Secrets Manager</text><text x="17" y="52" font-size="11" fill="#C9DBEB">Credentials outside code</text></g><g transform="translate(18 153)"><rect width="225" height="76" rx="13" fill="#fff" fill-opacity=".1"/><text x="17" y="29" font-size="14" font-weight="730" fill="#fff">Encryption at rest</text><text x="17" y="52" font-size="11" fill="#C9DBEB">Protected database storage</text></g><g transform="translate(18 245)"><rect width="225" height="76" rx="13" fill="#fff" fill-opacity=".1"/><text x="17" y="29" font-size="14" font-weight="730" fill="#fff">Logs and monitoring</text><text x="17" y="52" font-size="11" fill="#C9DBEB">Reviewable service activity</text></g><g transform="translate(18 337)"><rect width="225" height="88" rx="13" fill="#fff" fill-opacity=".1"/><text x="17" y="29" font-size="14" font-weight="730" fill="#fff">Backup and recovery</text><text x="17" y="52" font-size="11" fill="#C9DBEB">Managed data protection</text><text x="17" y="69" font-size="11" fill="#C9DBEB">Documented restore path</text></g></g>
  </g>
</svg>

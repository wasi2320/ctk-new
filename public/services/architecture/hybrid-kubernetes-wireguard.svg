<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="hybridTitle hybridDesc">
  <title id="hybridTitle">Hybrid Kubernetes platform over an encrypted WireGuard mesh</title>
  <desc id="hybridDesc">K3s connects retained on-premise servers and cloud burst nodes through an encrypted WireGuard mesh. Rancher provides cluster management, Argo CD provides GitOps delivery, Longhorn provides distributed storage, and CloudNativePG manages Kubernetes database workloads.</desc>
  <defs>
    <linearGradient id="hyBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF6FC"/></linearGradient>
    <filter id="hyShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324D" flood-opacity=".1"/></filter>
    <style>.t{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#102A43}.h{font-size:30px;font-weight:760}.sub{font-size:15px;fill:#52677C}.cap{font-size:12px;font-weight:760;letter-spacing:1px}.name{font-size:15px;font-weight:730}.meta{font-size:11px;fill:#61758A}.card{fill:#fff;stroke:#D8E5F1;stroke-width:1.5}</style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#hyBg)"/>
  <rect x="28" y="26" width="1144" height="668" rx="24" fill="none" stroke="#D9E6F2"/>
  <g class="t">
    <text class="h" x="58" y="72">Hybrid Kubernetes over an encrypted mesh</text>
    <text class="sub" x="58" y="99">Retained on-premise capacity and cloud burst nodes share one managed operating model</text>
    <g transform="translate(797 44)"><rect width="160" height="34" rx="17" fill="#E9F8F3"/><text x="80" y="22" text-anchor="middle" font-size="11" font-weight="750" fill="#087A55">RETAINED CAPACITY</text></g>
    <g transform="translate(972 44)"><rect width="170" height="34" rx="17" fill="#E8F2FF"/><text x="85" y="22" text-anchor="middle" font-size="11" font-weight="750" fill="#174EA6">CLOUD BURST NODES</text></g>

    <g filter="url(#hyShadow)" transform="translate(278 132)">
      <rect class="card" width="644" height="70" rx="16"/>
      <text class="cap" x="322" y="25" text-anchor="middle" fill="#2563EB">WORKLOADS</text>
      <text class="name" x="322" y="49" text-anchor="middle">Latency-sensitive applications, including live streaming</text>
    </g>

    <g transform="translate(48 244)">
      <rect width="472" height="282" rx="20" fill="#fff" stroke="#AFC8DF" stroke-width="1.5"/>
      <rect width="472" height="42" rx="20" fill="#EAF3FB"/>
      <path d="M0 21C0 9 9 0 21 0h430c12 0 21 9 21 21v21H0z" fill="#EAF3FB"/>
      <text class="cap" x="22" y="27" fill="#174D75">ON-PREMISE K3S  •  EXISTING HARDWARE</text>
      <g transform="translate(22 66)"><rect width="428" height="88" rx="15" fill="#12385C"/><text x="18" y="27" font-size="12" font-weight="760" fill="#A9D5FF">RETAINED WORKLOAD CAPACITY</text><rect x="18" y="43" width="120" height="28" rx="8" fill="#2D6ED6"/><text x="78" y="62" text-anchor="middle" font-size="11" font-weight="730" fill="#fff">K3s nodes</text><rect x="154" y="43" width="120" height="28" rx="8" fill="#0E9F6E"/><text x="214" y="62" text-anchor="middle" font-size="11" font-weight="730" fill="#fff">Workloads</text><rect x="290" y="43" width="120" height="28" rx="8" fill="#7C3AED"/><text x="350" y="62" text-anchor="middle" font-size="11" font-weight="730" fill="#fff">Data services</text></g>
      <g transform="translate(22 176)"><rect width="204" height="78" rx="13" fill="#FFF8EE"/><text class="name" x="102" y="31" text-anchor="middle" fill="#A15305">Longhorn</text><text class="meta" x="102" y="52" text-anchor="middle">Distributed storage</text></g>
      <g transform="translate(246 176)"><rect width="204" height="78" rx="13" fill="#F2EAFE"/><text class="name" x="102" y="31" text-anchor="middle" fill="#6427B7">CloudNativePG</text><text class="meta" x="102" y="52" text-anchor="middle">Database workloads</text></g>
    </g>

    <g transform="translate(680 244)">
      <rect width="472" height="282" rx="20" fill="#fff" stroke="#AFC8DF" stroke-width="1.5"/>
      <rect width="472" height="42" rx="20" fill="#EAF3FB"/>
      <path d="M0 21C0 9 9 0 21 0h430c12 0 21 9 21 21v21H0z" fill="#EAF3FB"/>
      <text class="cap" x="22" y="27" fill="#174D75">CLOUD K3S  •  BURST CAPACITY</text>
      <g transform="translate(22 66)"><rect width="428" height="88" rx="15" fill="#12385C"/><text x="18" y="27" font-size="12" font-weight="760" fill="#A9D5FF">ADDED CLOUD CAPACITY</text><rect x="18" y="43" width="120" height="28" rx="8" fill="#2D6ED6"/><text x="78" y="62" text-anchor="middle" font-size="11" font-weight="730" fill="#fff">K3s nodes</text><rect x="154" y="43" width="120" height="28" rx="8" fill="#0E9F6E"/><text x="214" y="62" text-anchor="middle" font-size="11" font-weight="730" fill="#fff">Burst workers</text><rect x="290" y="43" width="120" height="28" rx="8" fill="#7C3AED"/><text x="350" y="62" text-anchor="middle" font-size="11" font-weight="730" fill="#fff">Data services</text></g>
      <g transform="translate(22 176)"><rect width="204" height="78" rx="13" fill="#E9F8F3"/><text class="name" x="102" y="31" text-anchor="middle" fill="#087A55">Rancher</text><text class="meta" x="102" y="52" text-anchor="middle">Cluster management</text></g>
      <g transform="translate(246 176)"><rect width="204" height="78" rx="13" fill="#E8F2FF"/><text class="name" x="102" y="31" text-anchor="middle" fill="#174EA6">Argo CD</text><text class="meta" x="102" y="52" text-anchor="middle">GitOps delivery</text></g>
    </g>

    <path d="M520 382H672" fill="none" stroke="#7C3AED" stroke-width="6" stroke-dasharray="10 7"/>
    <rect x="536" y="341" width="128" height="28" rx="14" fill="#F2EAFE"/>
    <text x="600" y="360" text-anchor="middle" font-size="11" font-weight="760" fill="#6427B7">WIREGUARD</text>
    <text x="600" y="409" text-anchor="middle" font-size="10" fill="#6427B7">encrypted mesh</text>

    <rect x="48" y="563" width="1104" height="94" rx="18" fill="#102A43"/>
    <text x="74" y="591" font-size="12" font-weight="760" letter-spacing="1" fill="#A9D5FF">SHARED OPERATING MODEL</text>
    <g transform="translate(74 608)"><text font-size="13" font-weight="730" fill="#fff">Rancher management</text><text x="246" font-size="13" font-weight="730" fill="#fff">Argo CD delivery</text><text x="466" font-size="13" font-weight="730" fill="#fff">Longhorn storage</text><text x="686" font-size="13" font-weight="730" fill="#fff">CloudNativePG databases</text></g>
    <text x="600" y="682" text-anchor="middle" font-size="11" font-weight="730" fill="#52677C">Encrypted hybrid connectivity without dedicated private links</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="voipTitle voipDesc">
  <title id="voipTitle">VoIP and real-time call protection on Kubernetes</title>
  <desc id="voipDesc">Calls enter FusionPBX running on a DigitalOcean Kubernetes cluster. A Python voice verification service evaluates calls and returns an allow or flag decision. PostgreSQL stores persistent call data, Odoo provides CRM functions, Rancher manages the cluster, and Prometheus, Grafana, and Loki provide operational visibility.</desc>
  <defs><linearGradient id="vBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF6FC"/></linearGradient><filter id="vShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324D" flood-opacity=".1"/></filter><marker id="vArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#2563EB"/></marker><style>.t{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#102A43}.h{font-size:30px;font-weight:760}.sub{font-size:15px;fill:#52677C}.cap{font-size:12px;font-weight:760;letter-spacing:1px}.name{font-size:15px;font-weight:730}.meta{font-size:11px;fill:#61758A}.card{fill:#fff;stroke:#D8E5F1;stroke-width:1.5}</style></defs>
  <rect width="1200" height="720" rx="28" fill="url(#vBg)"/><rect x="28" y="26" width="1144" height="668" rx="24" fill="none" stroke="#D9E6F2"/>
  <g class="t"><text class="h" x="58" y="72">VoIP platform with real-time call protection</text><text class="sub" x="58" y="99">Stateful communications, Python call verification, and observable Kubernetes operations</text><g transform="translate(894 45)"><rect width="248" height="32" rx="16" fill="#E9F8F3"/><text x="124" y="21" text-anchor="middle" font-size="11" font-weight="750" fill="#087A55">DIGITALOCEAN KUBERNETES</text></g>
    <text class="cap" x="58" y="151" fill="#2563EB">CALL DECISION PATH</text><g filter="url(#vShadow)"><g transform="translate(58 170)"><rect class="card" width="140" height="64" rx="13"/><text class="name" x="70" y="29" text-anchor="middle">Inbound call</text><text class="meta" x="70" y="48" text-anchor="middle">SIP traffic</text></g><g transform="translate(240 170)"><rect width="160" height="64" rx="13" fill="#E8F2FF" stroke="#B9D4F4"/><text class="name" x="80" y="29" text-anchor="middle" fill="#174EA6">FusionPBX</text><text class="meta" x="80" y="48" text-anchor="middle">Call routing</text></g><g transform="translate(442 170)"><rect width="200" height="64" rx="13" fill="#F2EAFE" stroke="#D1B8F5"/><text class="name" x="100" y="29" text-anchor="middle" fill="#6427B7">Python voice service</text><text class="meta" x="100" y="48" text-anchor="middle">Real-time verification</text></g><g transform="translate(684 170)"><rect width="150" height="64" rx="13" fill="#F0FAF7" stroke="#B9E3D4"/><text class="name" x="75" y="29" text-anchor="middle" fill="#087A55">Allow or flag</text><text class="meta" x="75" y="48" text-anchor="middle">Decision returned</text></g></g><path d="M198 202H232M400 202H434M642 202H676" fill="none" stroke="#2563EB" stroke-width="2.3" marker-end="url(#vArrow)"/>
    <rect x="48" y="275" width="805" height="357" rx="20" fill="#fff" stroke="#AFC8DF" stroke-width="1.5"/><rect x="48" y="275" width="805" height="40" rx="20" fill="#EAF3FB"/><path d="M48 295c0-11 9-20 20-20h765c11 0 20 9 20 20v20H48z" fill="#EAF3FB"/><text class="cap" x="70" y="300" fill="#174D75">KUBERNETES CLUSTER  •  RANCHER MANAGED</text>
    <g transform="translate(70 340)"><rect width="360" height="120" rx="16" fill="#12385C"/><text x="18" y="28" font-size="12" font-weight="760" fill="#A9D5FF">COMMUNICATIONS WORKLOAD</text><rect x="18" y="46" width="150" height="52" rx="10" fill="#2D6ED6"/><text x="93" y="78" text-anchor="middle" font-size="13" font-weight="730" fill="#fff">FusionPBX pods</text><rect x="190" y="46" width="152" height="52" rx="10" fill="#7C3AED"/><text x="266" y="69" text-anchor="middle" font-size="12" font-weight="730" fill="#fff">Python verification</text><text x="266" y="85" text-anchor="middle" font-size="10" fill="#E3D5FA">voice service</text></g><g transform="translate(452 340)"><rect width="379" height="120" rx="16" fill="#F8FBFF" stroke="#BCD2E6"/><text class="cap" x="18" y="28" fill="#52677C">PERSISTENT SERVICES</text><rect x="18" y="46" width="165" height="52" rx="10" fill="#F2EAFE"/><text x="83" y="70" text-anchor="middle" font-size="12" font-weight="730" fill="#6427B7">PostgreSQL</text><text x="83" y="86" text-anchor="middle" font-size="10" fill="#6427B7">StatefulSet</text><rect x="198" y="46" width="163" height="52" rx="10" fill="#FFF8EE"/><text x="280" y="70" text-anchor="middle" font-size="12" font-weight="730" fill="#A15305">Odoo CRM</text><text x="280" y="86" text-anchor="middle" font-size="10" fill="#80520B">Containers</text></g>
    <g transform="translate(70 492)"><rect width="761" height="110" rx="16" fill="#F0FAF7" stroke="#B9E3D4"/><text class="cap" x="18" y="28" fill="#087A55">OPERATIONS</text><g transform="translate(18 46)"><rect width="220" height="43" rx="10" fill="#fff"/><text x="110" y="27" text-anchor="middle" font-size="12" font-weight="730" fill="#087A55">Prometheus metrics</text></g><g transform="translate(270 46)"><rect width="220" height="43" rx="10" fill="#fff"/><text x="110" y="27" text-anchor="middle" font-size="12" font-weight="730" fill="#087A55">Grafana dashboards</text></g><g transform="translate(522 46)"><rect width="220" height="43" rx="10" fill="#fff"/><text x="110" y="27" text-anchor="middle" font-size="12" font-weight="730" fill="#087A55">Loki logs</text></g></g>
    <g transform="translate(881 151)"><rect width="261" height="481" rx="20" fill="#102A43"/><text x="20" y="34" font-size="12" font-weight="760" letter-spacing="1" fill="#A9D5FF">OPERATING PRIORITIES</text><g transform="translate(18 61)"><rect width="225" height="80" rx="13" fill="#fff" fill-opacity=".1"/><text x="17" y="29" font-size="14" font-weight="730" fill="#fff">Call path reliability</text><text x="17" y="52" font-size="11" fill="#C9DBEB">Capacity and health checks</text></g><g transform="translate(18 157)"><rect width="225" height="80" rx="13" fill="#fff" fill-opacity=".1"/><text x="17" y="29" font-size="14" font-weight="730" fill="#fff">Durable call data</text><text x="17" y="52" font-size="11" fill="#C9DBEB">Persistent database state</text></g><g transform="translate(18 253)"><rect width="225" height="80" rx="13" fill="#fff" fill-opacity=".1"/><text x="17" y="29" font-size="14" font-weight="730" fill="#fff">Model integration tests</text><text x="17" y="52" font-size="11" fill="#C9DBEB">Realistic call behavior</text></g><g transform="translate(18 349)"><rect width="225" height="80" rx="13" fill="#fff" fill-opacity=".1"/><text x="17" y="29" font-size="14" font-weight="730" fill="#fff">Shared observability</text><text x="17" y="52" font-size="11" fill="#C9DBEB">Metrics, dashboards, logs</text></g></g>
  </g>

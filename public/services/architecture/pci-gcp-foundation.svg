<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="pciTitle pciDesc">
  <title id="pciTitle">PCI DSS workstation foundation design on Google Cloud</title>
  <desc id="pciDesc">A Shared VPC design for hardened Ubuntu 24.04 Google Cloud Workstations on ephemeral Compute Engine virtual machines with no public IP addresses, Shielded VM features, customer-managed encryption keys, and idle timeouts. Terraform modules and implementation documentation cover the foundation. Cloud Audit Logs, Security Command Center, VPC Service Controls, data loss prevention, and multifactor authentication are mapped as planning references, with documentation prepared to support QSA review.</desc>
  <defs>
    <linearGradient id="pBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF6FC"/></linearGradient>
    <linearGradient id="pDark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102A43"/><stop offset="1" stop-color="#174D75"/></linearGradient>
    <filter id="pShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324D" flood-opacity=".1"/></filter>
    <marker id="pArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#2563EB"/></marker>
    <style>.t{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#102A43}.h{font-size:30px;font-weight:760}.sub{font-size:15px;fill:#52677C}.cap{font-size:12px;font-weight:760;letter-spacing:1px}.name{font-size:15px;font-weight:730}.meta{font-size:11px;fill:#61758A}.card{fill:#fff;stroke:#D8E5F1;stroke-width:1.5}</style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#pBg)"/>
  <rect x="28" y="26" width="1144" height="668" rx="24" fill="none" stroke="#D9E6F2"/>
  <g class="t">
    <text class="h" x="58" y="72">PCI DSS workstation foundation design</text>
    <text class="sub" x="58" y="99">Hardened Cloud Workstations, private networking, encryption, and documented control mapping</text>
    <g transform="translate(921 45)"><rect width="221" height="32" rx="16" fill="#FFF2DE"/><circle cx="18" cy="16" r="5" fill="#E8790A"/><text x="31" y="20" font-size="11" font-weight="750" fill="#A15305">DESIGN + DOCUMENTATION</text></g>

    <text class="cap" x="58" y="151" fill="#2563EB">CONTROLLED WORKSTATION PATH</text>
    <g filter="url(#pShadow)">
      <g transform="translate(58 171)"><rect class="card" width="170" height="66" rx="13"/><text class="name" x="85" y="29" text-anchor="middle">Developers</text><text class="meta" x="85" y="49" text-anchor="middle">MFA requirement mapped</text></g>
      <g transform="translate(290 161)"><rect width="280" height="86" rx="14" fill="#E8F2FF" stroke="#B9D4F4"/><text class="name" x="140" y="31" text-anchor="middle" fill="#174EA6">Google Cloud Workstations</text><text class="meta" x="140" y="52" text-anchor="middle">Hardened Ubuntu 24.04 image</text><text class="meta" x="140" y="69" text-anchor="middle">Ephemeral development environment</text></g>
      <g transform="translate(632 171)"><rect width="220" height="66" rx="13" fill="#F0FAF7" stroke="#B9E3D4"/><text class="name" x="110" y="29" text-anchor="middle" fill="#087A55">Compute Engine VM</text><text class="meta" x="110" y="49" text-anchor="middle">No public IP address</text></g>
    </g>
    <path d="M228 204H282M570 204H624" fill="none" stroke="#2563EB" stroke-width="2.3" marker-end="url(#pArrow)"/>

    <rect x="48" y="278" width="805" height="354" rx="20" fill="#fff" stroke="#AFC8DF" stroke-width="1.5"/>
    <path d="M48 318v-20c0-11 9-20 20-20h765c11 0 20 9 20 20v20Z" fill="#EAF3FB"/>
    <text class="cap" x="70" y="303" fill="#174D75">SHARED VPC DESIGN  •  PRIVATE WORKSTATION CLUSTER</text>

    <g transform="translate(70 342)">
      <rect width="761" height="94" rx="16" fill="url(#pDark)"/>
      <text x="20" y="27" font-size="12" font-weight="760" fill="#A9D5FF">PRIVATE WORKSTATION BASELINE</text>
      <g transform="translate(20 44)"><rect width="165" height="32" rx="16" fill="#fff" fill-opacity=".1"/><text x="82" y="21" text-anchor="middle" font-size="10.5" font-weight="720" fill="#fff">NO PUBLIC IPS</text></g>
      <g transform="translate(201 44)"><rect width="165" height="32" rx="16" fill="#fff" fill-opacity=".1"/><text x="82" y="21" text-anchor="middle" font-size="10.5" font-weight="720" fill="#fff">IDLE TIMEOUTS</text></g>
      <g transform="translate(382 44)"><rect width="165" height="32" rx="16" fill="#fff" fill-opacity=".1"/><text x="82" y="21" text-anchor="middle" font-size="10.5" font-weight="720" fill="#fff">SHIELDED VMS</text></g>
      <g transform="translate(563 44)"><rect width="178" height="32" rx="16" fill="#fff" fill-opacity=".1"/><text x="89" y="21" text-anchor="middle" font-size="10.5" font-weight="720" fill="#fff">CMEK ENCRYPTION</text></g>
    </g>

    <g transform="translate(70 461)"><rect width="235" height="102" rx="16" fill="#E8F2FF" stroke="#B9D4F4"/><text class="cap" x="18" y="27" fill="#174EA6">HARDENED IMAGE</text><text class="name" x="18" y="56">Ubuntu 24.04</text><text class="meta" x="18" y="77">Standard workstation baseline</text></g>
    <g transform="translate(333 461)"><rect width="235" height="102" rx="16" fill="#F0FAF7" stroke="#B9E3D4"/><text class="cap" x="18" y="27" fill="#087A55">SHIELDED VM</text><text class="name" x="18" y="56">Platform protections</text><text class="meta" x="18" y="77">Secure Boot, vTPM, integrity</text></g>
    <g transform="translate(596 461)"><rect width="235" height="102" rx="16" fill="#F2EAFE" stroke="#D1B8F5"/><text class="cap" x="18" y="27" fill="#6427B7">CLOUD KMS</text><text class="name" x="18" y="56">Customer-managed key</text><text class="meta" x="18" y="77">CMEK encryption design</text></g>

    <g transform="translate(88 573)">
      <text class="cap" x="0" y="14" fill="#52677C">PREPARED DELIVERABLES</text>
      <rect x="0" y="24" width="180" height="32" rx="16" fill="#E8F2FF"/><text x="90" y="45" text-anchor="middle" font-size="10.5" font-weight="720" fill="#174EA6">TERRAFORM MODULES</text>
      <rect x="192" y="24" width="190" height="32" rx="16" fill="#E9F8F3"/><text x="287" y="45" text-anchor="middle" font-size="10.5" font-weight="720" fill="#087A55">IMPLEMENTATION DOCS</text>
      <rect x="394" y="24" width="205" height="32" rx="16" fill="#FFF2DE"/><text x="496" y="45" text-anchor="middle" font-size="10.5" font-weight="720" fill="#A15305">QSA REVIEW SUPPORT</text>
    </g>

    <g transform="translate(881 151)">
      <rect width="261" height="481" rx="20" fill="#102A43"/>
      <text x="20" y="34" font-size="12" font-weight="760" letter-spacing="1" fill="#A9D5FF">CONTROL SERVICE MAPPING</text>
      <g transform="translate(18 59)"><rect width="225" height="58" rx="12" fill="#fff" fill-opacity=".1"/><text x="16" y="25" font-size="13.5" font-weight="730" fill="#fff">Cloud Audit Logs</text><text x="16" y="44" font-size="10.5" fill="#C9DBEB">Logging requirement reference</text></g>
      <g transform="translate(18 128)"><rect width="225" height="58" rx="12" fill="#fff" fill-opacity=".1"/><text x="16" y="25" font-size="13.5" font-weight="730" fill="#fff">Security Command Center</text><text x="16" y="44" font-size="10.5" fill="#C9DBEB">Security posture reference</text></g>
      <g transform="translate(18 197)"><rect width="225" height="58" rx="12" fill="#fff" fill-opacity=".1"/><text x="16" y="25" font-size="13.5" font-weight="730" fill="#fff">VPC Service Controls</text><text x="16" y="44" font-size="10.5" fill="#C9DBEB">Service boundary reference</text></g>
      <g transform="translate(18 266)"><rect width="225" height="58" rx="12" fill="#fff" fill-opacity=".1"/><text x="16" y="25" font-size="13.5" font-weight="730" fill="#fff">Data loss prevention</text><text x="16" y="44" font-size="10.5" fill="#C9DBEB">Sensitive data reference</text></g>
      <g transform="translate(18 335)"><rect width="225" height="58" rx="12" fill="#fff" fill-opacity=".1"/><text x="16" y="25" font-size="13.5" font-weight="730" fill="#fff">MFA</text><text x="16" y="44" font-size="10.5" fill="#C9DBEB">Access requirement reference</text></g>
      <g transform="translate(18 414)"><rect width="225" height="42" rx="21" fill="#FFF2DE"/><text x="112" y="26" text-anchor="middle" font-size="10.5" font-weight="750" fill="#A15305">PLANNING REFERENCES</text></g>
    </g>
  </g>
</svg>

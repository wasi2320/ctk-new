<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="secureTitle secureDesc">
  <title id="secureTitle">Secure and scalable Amazon EKS platform architecture</title>
  <desc id="secureDesc">GitHub Actions tests and scans application code, pushes signed images to Amazon ECR, and updates a GitOps repository. Argo CD deploys to a private Amazon EKS cluster across two Availability Zones. CloudFront, AWS WAF, and an Application Load Balancer protect user traffic. RDS, Secrets Manager, KMS, GuardDuty, CloudWatch, Prometheus, and Grafana support security, data, and operations.</desc>
  <defs>
    <linearGradient id="secureBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EEF6FC"/>
    </linearGradient>
    <linearGradient id="secureEks" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12385C"/>
      <stop offset="1" stop-color="#0E2740"/>
    </linearGradient>
    <filter id="secureShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#17324D" flood-opacity="0.10"/>
    </filter>
    <marker id="secureArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 9 5 1 9Z" fill="#2563EB"/>
    </marker>
    <marker id="secureArrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 9 5 1 9Z" fill="#7C3AED"/>
    </marker>
    <marker id="secureArrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 9 5 1 9Z" fill="#0E9F6E"/>
    </marker>
    <style>
      .st { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #102A43; }
      .stitle { font-size: 30px; font-weight: 760; letter-spacing: -0.5px; }
      .ssub { font-size: 15px; fill: #52677C; }
      .ssection { font-size: 13px; font-weight: 760; letter-spacing: 1.2px; }
      .sname { font-size: 15px; font-weight: 730; }
      .smeta { font-size: 12px; fill: #61758A; }
      .scard { fill: #FFFFFF; stroke: #D8E5F1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#secureBg)"/>

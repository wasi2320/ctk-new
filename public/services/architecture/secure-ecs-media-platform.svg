<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="mediaTitle mediaDesc">
  <title id="mediaTitle">Secure Amazon ECS application and media processing platform</title>
  <desc id="mediaDesc">GitHub, CodePipeline, and CodeBuild publish container images to Amazon ECR and deploy to ECS. Users pass through AWS WAF and a load balancer to private frontend and backend services. Lambda coordinates Rekognition, Textract, Comprehend, and MediaConvert processing. Secrets Manager, CloudWatch, Prometheus, Grafana, and backups support security and operations.</desc>
  <defs><linearGradient id="mBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF6FC"/></linearGradient><filter id="mShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324D" flood-opacity=".1"/></filter><marker id="mArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#2563EB"/></marker><style>.t{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#102A43}.h{font-size:30px;font-weight:760}.sub{font-size:15px;fill:#52677C}.cap{font-size:12px;font-weight:760;letter-spacing:1px}.name{font-size:14px;font-weight:730}.meta{font-size:11px;fill:#61758A}.card{fill:#fff;stroke:#D8E5F1;stroke-width:1.5}</style></defs>
  <rect width="1200" height="720" rx="28" fill="url(#mBg)"/><rect x="28" y="26" width="1144" height="668" rx="24" fill="none" stroke="#D9E6F2"/>
  <g class="t"><text class="h" x="58" y="72">Secure ECS application and media automation</text><text class="sub" x="58" y="99">Repeatable delivery, private services, asynchronous content processing, and centralized operations</text>
    <rect x="50" y="127" width="1092" height="116" rx="18" fill="#fff" stroke="#D8E5F1"/><rect x="50" y="127" width="8" height="116" rx="4" fill="#7C3AED"/><text class="cap" x="78" y="154" fill="#7C3AED">AUTOMATED DELIVERY</text><g filter="url(#mShadow)"><g transform="translate(78 173)"><rect class="card" width="140" height="52" rx="12"/><text class="name" x="70" y="31" text-anchor="middle">GitHub</text></g><g transform="translate(260 173)"><rect class="card" width="170" height="52" rx="12"/><text class="name" x="85" y="23" text-anchor="middle">CodePipeline</text><text class="meta" x="85" y="40" text-anchor="middle">CodeBuild</text></g><g transform="translate(472 173)"><rect width="150" height="52" rx="12" fill="#FFF8EE" stroke="#F4CCA0"/><text class="name" x="75" y="23" text-anchor="middle" fill="#A15305">Amazon ECR</text><text class="meta" x="75" y="40" text-anchor="middle">Versioned image</text></g><g transform="translate(664 173)"><rect width="169" height="52" rx="12" fill="#F0FAF7" stroke="#B9E3D4"/><text class="name" x="85" y="23" text-anchor="middle" fill="#087A55">CloudFormation</text><text class="meta" x="85" y="40" text-anchor="middle">Infrastructure update</text></g></g><path d="M218 199H252M430 199H464M622 199H656" fill="none" stroke="#7C3AED" stroke-width="2.3" marker-end="url(#mArrow)"/>
    <text class="cap" x="58" y="283" fill="#2563EB">USER REQUEST PATH</text><g transform="translate(58 300)"><rect class="card" width="130" height="56" rx="12"/><text class="name" x="65" y="34" text-anchor="middle">Users</text></g><g transform="translate(232 300)"><rect width="160" height="56" rx="12" fill="#FFF8EE" stroke="#F4CCA0"/><text class="name" x="80" y="25" text-anchor="middle" fill="#A15305">AWS WAF</text><text class="meta" x="80" y="43" text-anchor="middle">Request rules</text></g><g transform="translate(436 300)"><rect width="200" height="56" rx="12" fill="#F0FAF7" stroke="#B9E3D4"/><text class="name" x="100" y="25" text-anchor="middle" fill="#087A55">Load balancer</text><text class="meta" x="100" y="43" text-anchor="middle">Healthy targets</text></g><path d="M188 328H224M392 328H428" fill="none" stroke="#2563EB" stroke-width="2.3" marker-end="url(#mArrow)"/>
    <rect x="48" y="388" width="805" height="244" rx="20" fill="#fff" stroke="#AFC8DF" stroke-width="1.5"/><rect x="48" y="388" width="805" height="40" rx="20" fill="#EAF3FB"/><path d="M48 408c0-11 9-20 20-20h765c11 0 20 9 20 20v20H48z" fill="#EAF3FB"/><text class="cap" x="70" y="413" fill="#174D75">PRIVATE AWS VPC  •  AMAZON ECS</text><g transform="translate(70 452)"><rect width="304" height="74" rx="14" fill="#12385C"/><text x="152" y="31" text-anchor="middle" font-size="14" font-weight="730" fill="#fff">Frontend and backend services</text><text x="152" y="53" text-anchor="middle" font-size="11" fill="#C9DBEB">Docker tasks with auto scaling</text></g><g transform="translate(396 452)"><rect width="185" height="74" rx="14" fill="#F2EAFE" stroke="#D1B8F5"/><text class="name" x="92" y="31" text-anchor="middle" fill="#6427B7">AWS Lambda</text><text class="meta" x="92" y="52" text-anchor="middle">Event coordination</text></g><g transform="translate(603 452)"><rect width="228" height="74" rx="14" fill="#FFF8EE" stroke="#F4CCA0"/><text class="name" x="114" y="31" text-anchor="middle" fill="#A15305">MediaConvert</text><text class="meta" x="114" y="52" text-anchor="middle">Media processing</text></g><path d="M374 489H388M581 489H595" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mArrow)"/><g transform="translate(70 548)"><rect width="511" height="60" rx="13" fill="#E8F2FF"/><text class="name" x="255" y="25" text-anchor="middle" fill="#174EA6">Rekognition  •  Textract  •  Comprehend</text><text class="meta" x="255" y="44" text-anchor="middle">Image, document, and text analysis</text></g><g transform="translate(603 548)"><rect width="228" height="60" rx="13" fill="#E9F8F3"/><text class="name" x="114" y="25" text-anchor="middle" fill="#087A55">Data and backups</text><text class="meta" x="114" y="44" text-anchor="middle">Protected application state</text></g>
    <g transform="translate(881 127)"><rect width="261" height="505" rx="20" fill="#102A43"/><text x="20" y="34" font-size="12" font-weight="760" letter-spacing="1" fill="#A9D5FF">SECURITY AND OPERATIONS</text><g transform="translate(18 61)"><rect width="225" height="76" rx="13" fill="#fff" fill-opacity=".1"/><text x="17" y="29" font-size="14" font-weight="730" fill="#fff">Secrets Manager</text><text x="17" y="52" font-size="11" fill="#C9DBEB">Credentials outside code</text></g><g transform="translate(18 153)"><rect width="225" height="76" rx="13" fill="#fff" fill-opacity=".1"/><text x="17" y="29" font-size="14" font-weight="730" fill="#fff">CloudWatch</text><text x="17" y="52" font-size="11" fill="#C9DBEB">AWS service health and logs</text></g><g transform="translate(18 245)"><rect width="225" height="76" rx="13" fill="#fff" fill-opacity=".1"/><text x="17" y="29" font-size="14" font-weight="730" fill="#fff">Prometheus and Grafana</text><text x="17" y="52" font-size="11" fill="#C9DBEB">Application metrics and alerts</text></g><g transform="translate(18 337)"><rect width="225" height="88" rx="13" fill="#fff" fill-opacity=".1"/><text x="17" y="29" font-size="14" font-weight="730" fill="#fff">Recovery controls</text><text x="17" y="52" font-size="11" fill="#C9DBEB">Backups and restore path</text><text x="17" y="69" font-size="11" fill="#C9DBEB">Repeatable infrastructure</text></g></g>
  </g>
</svg>

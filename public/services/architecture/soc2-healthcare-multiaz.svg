<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="soc2Title soc2Desc">
  <title id="soc2Title">SOC 2 healthcare platform across two AWS Availability Zones</title>
  <desc id="soc2Desc">Users reach a WAF and load balancer before traffic enters Docker application services in two Availability Zones. RDS for SQL Server uses synchronous Multi-AZ replication. S3 and file storage, VPN access, encryption, role based access, Elasticsearch audit logs, and alerts support availability and SOC 2 evidence.</desc>
  <defs>
    <linearGradient id="soc2Bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF6FC"/></linearGradient>
    <filter id="soc2Shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324D" flood-opacity=".1"/></filter>
    <marker id="soc2Arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#2563EB"/></marker>
    <style>.t{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#102A43}.h{font-size:30px;font-weight:760}.sub{font-size:15px;fill:#52677C}.cap{font-size:12px;font-weight:760;letter-spacing:1px}.name{font-size:15px;font-weight:730}.meta{font-size:11px;fill:#61758A}.card{fill:#fff;stroke:#D8E5F1;stroke-width:1.5}</style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#soc2Bg)"/><rect x="28" y="26" width="1144" height="668" rx="24" fill="none" stroke="#D9E6F2"/>
  <g class="t">
    <text class="h" x="58" y="72">SOC 2 ready healthcare platform on AWS</text>
    <text class="sub" x="58" y="99">Multi-AZ application and data services with traceable access, logging, and recovery controls</text>
    <g transform="translate(947 45)"><rect width="195" height="32" rx="16" fill="#E9F8F3"/><text x="98" y="21" text-anchor="middle" font-size="11" font-weight="750" fill="#087A55">99.99% UPTIME REPORTED</text></g>

    <text class="cap" x="58" y="147" fill="#2563EB">PROTECTED REQUEST PATH</text>
    <g filter="url(#soc2Shadow)">
      <g transform="translate(58 166)"><rect class="card" width="150" height="66" rx="13"/><text class="name" x="75" y="30" text-anchor="middle">Healthcare users</text><text class="meta" x="75" y="49" text-anchor="middle">TLS requests</text></g>
      <g transform="translate(263 166)"><rect width="190" height="66" rx="13" fill="#FFF8EE" stroke="#F4CCA0"/><text class="name" x="95" y="30" text-anchor="middle" fill="#A15305">AWS WAF</text><text class="meta" x="95" y="49" text-anchor="middle">Request filtering</text></g>
      <g transform="translate(508 166)"><rect width="210" height="66" rx="13" fill="#F0FAF7" stroke="#B9E3D4"/><text class="name" x="105" y="30" text-anchor="middle" fill="#087A55">Application Load Balancer</text><text class="meta" x="105" y="49" text-anchor="middle">Health based routing</text></g>
    </g>
    <path d="M208 199H255M453 199H500" fill="none" stroke="#2563EB" stroke-width="2.3" marker-end="url(#soc2Arrow)"/>

    <rect x="48" y="266" width="814" height="365" rx="20" fill="#fff" stroke="#AFC8DF" stroke-width="1.5"/>
    <rect x="48" y="266" width="814" height="40" rx="20" fill="#EAF3FB"/><path d="M48 286c0-11 9-20 20-20h774c11 0 20 9 20 20v20H48z" fill="#EAF3FB"/>
    <text class="cap" x="70" y="291" fill="#174D75">PRIVATE VPC  •  TWO AVAILABILITY ZONES</text>
    <g transform="translate(70 330)">
      <rect width="365" height="135" rx="16" fill="#F8FBFF" stroke="#BCD2E6"/><text class="cap" x="18" y="27" fill="#52677C">AVAILABILITY ZONE A</text>
      <rect x="18" y="45" width="158" height="68" rx="12" fill="#12385C"/><text x="97" y="73" text-anchor="middle" font-size="14" font-weight="730" fill="#fff">Docker services</text><text x="97" y="94" text-anchor="middle" font-size="11" fill="#C9DBEB">Application tasks</text>
      <rect x="191" y="45" width="156" height="68" rx="12" fill="#F2EAFE"/><text x="269" y="73" text-anchor="middle" font-size="14" font-weight="730" fill="#6427B7">SQL primary</text><text x="269" y="94" text-anchor="middle" font-size="11" fill="#6427B7">RDS for MSSQL</text>
    </g>
    <g transform="translate(475 330)">
      <rect width="365" height="135" rx="16" fill="#F8FBFF" stroke="#BCD2E6"/><text class="cap" x="18" y="27" fill="#52677C">AVAILABILITY ZONE B</text>
      <rect x="18" y="45" width="158" height="68" rx="12" fill="#12385C"/><text x="97" y="73" text-anchor="middle" font-size="14" font-weight="730" fill="#fff">Docker services</text><text x="97" y="94" text-anchor="middle" font-size="11" fill="#C9DBEB">Failover capacity</text>
      <rect x="191" y="45" width="156" height="68" rx="12" fill="#F2EAFE"/><text x="269" y="73" text-anchor="middle" font-size="14" font-weight="730" fill="#6427B7">SQL standby</text><text x="269" y="94" text-anchor="middle" font-size="11" fill="#6427B7">Synchronous replica</text>
    </g>
    <path d="M339 443v29h405v-21" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#soc2Arrow)"/><text x="542" y="467" text-anchor="middle" font-size="10.5" font-weight="700" fill="#174EA6">Multi-AZ replication and failover</text>
    <g transform="translate(70 500)"><rect width="230" height="96" rx="14" fill="#FFF8EE" stroke="#F4CCA0"/><text class="name" x="115" y="34" text-anchor="middle" fill="#A15305">Amazon S3</text><text class="meta" x="115" y="56" text-anchor="middle">Durable object storage</text><text class="meta" x="115" y="74" text-anchor="middle">Backup data</text></g>
    <g transform="translate(320 500)"><rect width="230" height="96" rx="14" fill="#F0FAF7" stroke="#B9E3D4"/><text class="name" x="115" y="34" text-anchor="middle" fill="#087A55">File storage</text><text class="meta" x="115" y="56" text-anchor="middle">Asynchronous replica</text><text class="meta" x="115" y="74" text-anchor="middle">Cross-AZ durability</text></g>
    <g transform="translate(570 500)"><rect width="270" height="96" rx="14" fill="#EAF3FB" stroke="#BCD2E6"/><text class="name" x="135" y="34" text-anchor="middle" fill="#174D75">On-premise connection</text><text class="meta" x="135" y="56" text-anchor="middle">AWS VPN</text><text class="meta" x="135" y="74" text-anchor="middle">Controlled private access</text></g>

    <g transform="translate(890 148)"><rect width="252" height="483" rx="20" fill="#102A43"/><text x="22" y="35" font-size="12" font-weight="760" letter-spacing="1" fill="#A9D5FF">SOC 2 CONTROL EVIDENCE</text>
      <g transform="translate(20 59)"><rect width="212" height="72" rx="13" fill="#fff" fill-opacity=".1"/><text x="18" y="29" font-size="14" font-weight="730" fill="#fff">Role based access</text><text x="18" y="51" font-size="11" fill="#C9DBEB">Least privilege permissions</text></g>
      <g transform="translate(20 145)"><rect width="212" height="72" rx="13" fill="#fff" fill-opacity=".1"/><text x="18" y="29" font-size="14" font-weight="730" fill="#fff">Encryption</text><text x="18" y="51" font-size="11" fill="#C9DBEB">In transit and at rest</text></g>
      <g transform="translate(20 231)"><rect width="212" height="88" rx="13" fill="#fff" fill-opacity=".1"/><text x="18" y="29" font-size="14" font-weight="730" fill="#fff">Elasticsearch audit trail</text><text x="18" y="51" font-size="11" fill="#C9DBEB">Centralized activity logs</text><text x="18" y="69" font-size="11" fill="#C9DBEB">Reviewable evidence</text></g>
      <g transform="translate(20 333)"><rect width="212" height="88" rx="13" fill="#fff" fill-opacity=".1"/><text x="18" y="29" font-size="14" font-weight="730" fill="#fff">Real-time alerting</text><text x="18" y="51" font-size="11" fill="#C9DBEB">Availability and control alerts</text><text x="18" y="69" font-size="11" fill="#C9DBEB">Documented response</text></g>
    </g>
  </g>
</svg>

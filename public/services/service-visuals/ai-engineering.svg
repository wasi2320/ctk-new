<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Production AI engineering workflow</title>
  <desc id="desc">A workflow connecting a business process and approved data to model orchestration, reviewed output, access controls, evaluation, and monitoring in AWS.</desc>
  <defs>
    <linearGradient id="bg" x1="74" y1="36" x2="650" y2="486" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16212E" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#FF9900"/>
    </marker>
  </defs>
  <rect x="28" y="24" width="664" height="472" rx="32" fill="url(#bg)"/>
  <rect x="54" y="50" width="612" height="420" rx="26" fill="#fff" stroke="#D9E0E8" filter="url(#shadow)"/>
  <rect x="80" y="74" width="170" height="30" rx="15" fill="#16212E"/>
  <text x="165" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#fff">PRODUCTION AI SYSTEM</text>
  <rect x="532" y="74" width="108" height="30" rx="15" fill="#FFF4E5"/>
  <circle cx="550" cy="89" r="5" fill="#FF9900"/>
  <text x="590" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#6B4300">AWS READY</text>
  <text x="80" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#16212E">From defined workflow to monitored output</text>
  <text x="80" y="166" font-family="Arial, sans-serif" font-size="14" fill="#5D6875">Data, model, controls, and operations designed as one system.</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="205" width="126" height="96" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
    <circle cx="103" cy="228" r="8" fill="#FF9900"/>
    <text x="103" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#16212E"><tspan x="143">Business</tspan><tspan x="143" dy="20">workflow</tspan></text>
    <path d="M214 253H242" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="250" y="205" width="126" height="96" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
    <circle cx="273" cy="228" r="8" fill="#FF9900"/>
    <text x="313" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#16212E"><tspan x="313">Approved data</tspan><tspan x="313" dy="20">and retrieval</tspan></text>
    <path d="M384 253H412" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="420" y="205" width="126" height="96" rx="16" fill="#16212E"/>
    <circle cx="443" cy="228" r="8" fill="#FF9900"/>
    <text x="483" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#fff"><tspan x="483">Model</tspan><tspan x="483" dy="20">orchestration</tspan></text>
    <path d="M554 253H574" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="582" y="205" width="58" height="96" rx="16" fill="#FFF4E5" stroke="#FFB84D"/>
    <path d="M600 252l8 8 15-18" fill="none" stroke="#B85F00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="611" y="285" text-anchor="middle" font-size="11" font-weight="700" fill="#6B4300">REVIEW</text>
  </g>
  <text x="80" y="343" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#74808D">PRODUCTION CONTROLS</text>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#16212E">
    <rect x="80" y="361" width="168" height="58" rx="14" fill="#F8FAFC" stroke="#D9E0E8"/>
    <path d="M104 389v-7a7 7 0 0114 0v7m-17 0h20v14h-20z" fill="none" stroke="#FF9900" stroke-width="2"/>
    <text x="181" y="397" text-anchor="middle">Access control</text>
    <rect x="267" y="361" width="168" height="58" rx="14" fill="#F8FAFC" stroke="#D9E0E8"/>
    <path d="M290 399l7-10 8 6 10-15" fill="none" stroke="#FF9900" stroke-width="3" stroke-linecap="round"/>
    <text x="359" y="397" text-anchor="middle">Evaluation</text>
    <rect x="454" y="361" width="186" height="58" rx="14" fill="#F8FAFC" stroke="#D9E0E8"/>
    <path d="M476 400v-14m10 14v-24m10 24v-18" stroke="#FF9900" stroke-width="3" stroke-linecap="round"/>
    <text x="578" y="397" text-anchor="middle">Monitoring and cost</text>
  </g>
  <text x="80" y="448" font-family="Arial, sans-serif" font-size="12" fill="#74808D">Human review is placed where the workflow and risk require it.</text>
</svg>

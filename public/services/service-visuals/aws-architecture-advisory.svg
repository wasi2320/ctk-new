<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AWS architecture advisory process</title>
  <desc id="desc">An advisory engagement moves from current-state assessment through documented architecture decisions and a prioritized roadmap to implementation support, using reliability, security, cost, operability, and team skills as decision criteria.</desc>
  <defs>
    <linearGradient id="page" x1="50" y1="30" x2="1140" y2="690" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#E9EFF6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#16212E" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#FF9900"/></marker>
  </defs>
  <rect x="28" y="24" width="1144" height="672" rx="38" fill="url(#page)"/><rect x="62" y="50" width="1076" height="620" rx="30" fill="#FFFFFF" stroke="#D9E0E8" filter="url(#shadow)"/>
  <rect x="94" y="78" width="254" height="32" rx="16" fill="#16212E"/><text x="221" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#FFFFFF">AWS ARCHITECTURE ADVISORY</text>
  <text x="94" y="151" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16212E">Turn architecture uncertainty into an actionable roadmap</text>
  <text x="94" y="181" font-family="Arial, sans-serif" font-size="16" fill="#5D6875">Recommendations are tied to current evidence, explicit tradeoffs, ownership, and implementation sequence.</text>
  <g font-family="Arial, sans-serif">
    <rect x="94" y="240" width="220" height="238" rx="22" fill="#FFFFFF" stroke="#D9E0E8"/>
    <circle cx="128" cy="276" r="17" fill="#FFF4E5" stroke="#FF9900" stroke-width="2"/><text x="128" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#6B4300">1</text>
    <text x="157" y="282" font-size="18" font-weight="700" fill="#16212E">Current state</text>
    <path d="M120 317H288" stroke="#E2E8F0"/>
    <text x="120" y="348" font-size="13" fill="#5D6875">Workloads and dependencies</text><text x="120" y="376" font-size="13" fill="#5D6875">Risk and reliability signals</text><text x="120" y="404" font-size="13" fill="#5D6875">Cost and delivery constraints</text><text x="120" y="432" font-size="13" fill="#5D6875">Team ownership and skills</text>
    <path d="M322 359H350" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="362" y="240" width="220" height="238" rx="22" fill="#16212E"/>
    <circle cx="396" cy="276" r="17" fill="#FF9900"/><text x="396" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#16212E">2</text>
    <text x="425" y="282" font-size="18" font-weight="700" fill="#FFFFFF">Decision records</text>
    <path d="M388 317H556" stroke="#445164"/>
    <text x="388" y="348" font-size="13" fill="#D7DEE7">Options and assumptions</text><text x="388" y="376" font-size="13" fill="#D7DEE7">Tradeoffs and rationale</text><text x="388" y="404" font-size="13" fill="#D7DEE7">Target architecture</text><text x="388" y="432" font-size="13" fill="#D7DEE7">Acceptance criteria</text>
    <path d="M590 359H618" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="630" y="240" width="220" height="238" rx="22" fill="#FFFFFF" stroke="#D9E0E8"/>
    <circle cx="664" cy="276" r="17" fill="#FFF4E5" stroke="#FF9900" stroke-width="2"/><text x="664" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#6B4300">3</text>
    <text x="693" y="282" font-size="18" font-weight="700" fill="#16212E">Prioritized roadmap</text>
    <path d="M656 317H824" stroke="#E2E8F0"/>
    <text x="656" y="348" font-size="13" fill="#5D6875">Sequence and dependencies</text><text x="656" y="376" font-size="13" fill="#5D6875">Effort and ownership</text><text x="656" y="404" font-size="13" fill="#5D6875">Risk reduction first</text><text x="656" y="432" font-size="13" fill="#5D6875">Measurable checkpoints</text>
    <path d="M858 359H886" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="898" y="240" width="208" height="238" rx="22" fill="#FFF4E5" stroke="#FFB84D"/>
    <circle cx="932" cy="276" r="17" fill="#FF9900"/><text x="932" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#16212E">4</text>
    <text x="961" y="282" font-size="18" font-weight="700" fill="#6B4300">Implementation</text>
    <path d="M924 317H1080" stroke="#F1C27A"/>
    <text x="924" y="348" font-size="13" fill="#7A5521">Architecture support</text><text x="924" y="376" font-size="13" fill="#7A5521">Infrastructure automation</text><text x="924" y="404" font-size="13" fill="#7A5521">Review and validation</text><text x="924" y="432" font-size="13" fill="#7A5521">Team handoff</text>

    <rect x="94" y="505" width="1012" height="54" rx="16" fill="#F1F5F9"/>
    <text x="120" y="537" font-size="12" font-weight="700" letter-spacing=".6" fill="#74808D">DECISION LENS</text>
    <text x="255" y="537" font-size="13" font-weight="700" fill="#16212E">Reliability</text><circle cx="337" cy="533" r="3" fill="#FF9900"/><text x="354" y="537" font-size="13" font-weight="700" fill="#16212E">Security</text><circle cx="420" cy="533" r="3" fill="#FF9900"/><text x="437" y="537" font-size="13" font-weight="700" fill="#16212E">Cost</text><circle cx="481" cy="533" r="3" fill="#FF9900"/><text x="498" y="537" font-size="13" font-weight="700" fill="#16212E">Operability</text><circle cx="580" cy="533" r="3" fill="#FF9900"/><text x="597" y="537" font-size="13" font-weight="700" fill="#16212E">Compliance</text><circle cx="690" cy="533" r="3" fill="#FF9900"/><text x="707" y="537" font-size="13" font-weight="700" fill="#16212E">Team skills</text><circle cx="785" cy="533" r="3" fill="#FF9900"/><text x="802" y="537" font-size="13" font-weight="700" fill="#16212E">Business timing</text>
  </g>
  <text x="94" y="611" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#16212E">ADVISORY NOTE</text><text x="205" y="611" font-family="Arial, sans-serif" font-size="13" fill="#5D6875">The roadmap is based on available evidence and should be refined as implementation reveals new constraints.</text>
  <circle cx="104" cy="640" r="5" fill="#FF9900"/><text x="120" y="645" font-family="Arial, sans-serif" font-size="12" fill="#74808D">A recommendation is useful only when tradeoffs, ownership, and a practical next decision are explicit.</text>
</svg>

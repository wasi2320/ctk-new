<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AWS cloud foundation reference architecture</title>
  <desc id="desc">An AWS landing zone organizes workload, shared service, security, and log archive accounts around segmented networking, Multi-AZ application services, protected data, observability, identity, infrastructure as code, and recovery controls.</desc>
  <defs>
    <linearGradient id="page" x1="50" y1="30" x2="1140" y2="690" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#E9EFF6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#16212E" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#FF9900"/></marker>
  </defs>
  <rect x="28" y="24" width="1144" height="672" rx="38" fill="url(#page)"/>
  <rect x="62" y="50" width="1076" height="620" rx="30" fill="#FFFFFF" stroke="#D9E0E8" filter="url(#shadow)"/>
  <rect x="94" y="78" width="222" height="32" rx="16" fill="#16212E"/>
  <text x="205" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#FFFFFF">AWS CLOUD FOUNDATION</text>
  <text x="94" y="151" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16212E">A governed foundation for reliable AWS workloads</text>
  <text x="94" y="181" font-family="Arial, sans-serif" font-size="16" fill="#5D6875">Account structure, network paths, availability, data, and operations are designed together.</text>
  <rect x="90" y="211" width="1020" height="350" rx="24" fill="#FBFCFE" stroke="#96A2AF" stroke-width="2"/>
  <rect x="112" y="195" width="285" height="34" rx="17" fill="#FFF4E5" stroke="#FFB84D"/>
  <text x="254" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".8" fill="#6B4300">AWS ORGANIZATION AND LANDING ZONE</text>
  <g font-family="Arial, sans-serif">
    <rect x="120" y="244" width="168" height="44" rx="12" fill="#F1F5F9"/><text x="204" y="271" text-anchor="middle" font-size="13" font-weight="700" fill="#16212E">Security account</text>
    <rect x="302" y="244" width="168" height="44" rx="12" fill="#F1F5F9"/><text x="386" y="271" text-anchor="middle" font-size="13" font-weight="700" fill="#16212E">Log archive</text>
    <rect x="484" y="244" width="168" height="44" rx="12" fill="#F1F5F9"/><text x="568" y="271" text-anchor="middle" font-size="13" font-weight="700" fill="#16212E">Shared services</text>
    <rect x="666" y="244" width="168" height="44" rx="12" fill="#16212E"/><text x="750" y="271" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Workload accounts</text>
    <rect x="848" y="244" width="212" height="44" rx="12" fill="#FFF4E5"/><text x="954" y="271" text-anchor="middle" font-size="13" font-weight="700" fill="#6B4300">IAM and guardrails</text>

    <rect x="120" y="314" width="230" height="170" rx="19" fill="#FFFFFF" stroke="#D9E0E8"/>
    <text x="235" y="343" text-anchor="middle" font-size="17" font-weight="700" fill="#16212E">Segmented VPC network</text>
    <rect x="144" y="363" width="182" height="40" rx="10" fill="#FFF4E5" stroke="#FFB84D"/><text x="235" y="388" text-anchor="middle" font-size="12" font-weight="700" fill="#6B4300">Controlled ingress</text>
    <rect x="144" y="418" width="82" height="42" rx="10" fill="#F1F5F9"/><text x="185" y="444" text-anchor="middle" font-size="11" font-weight="700" fill="#16212E">Private A</text>
    <rect x="244" y="418" width="82" height="42" rx="10" fill="#F1F5F9"/><text x="285" y="444" text-anchor="middle" font-size="11" font-weight="700" fill="#16212E">Private B</text>
    <path d="M358 399H397" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="408" y="314" width="310" height="170" rx="20" fill="#16212E"/>
    <text x="563" y="343" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Multi-AZ application services</text>
    <rect x="437" y="365" width="108" height="73" rx="13" fill="#2D3948" stroke="#FF9900"/><text x="491" y="389" text-anchor="middle" font-size="11" font-weight="700" fill="#FFB84D">AZ A</text><rect x="458" y="403" width="66" height="17" rx="5" fill="#FFFFFF"/>
    <rect x="581" y="365" width="108" height="73" rx="13" fill="#2D3948" stroke="#FF9900"/><text x="635" y="389" text-anchor="middle" font-size="11" font-weight="700" fill="#FFB84D">AZ B</text><rect x="602" y="403" width="66" height="17" rx="5" fill="#FFFFFF"/>
    <path d="M545 401H581" stroke="#FF9900" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="563" y="464" text-anchor="middle" font-size="12" fill="#D7DEE7">Load distribution, health checks, and scaling</text>
    <path d="M726 399H765" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="776" y="314" width="284" height="76" rx="17" fill="#FFFFFF" stroke="#D9E0E8"/>
    <ellipse cx="808" cy="345" rx="18" ry="7" fill="none" stroke="#FF9900" stroke-width="2.5"/><path d="M790 345v21c0 4 8 7 18 7s18-3 18-7v-21M790 356c0 4 8 7 18 7s18-3 18-7" fill="none" stroke="#FF9900" stroke-width="2.5"/>
    <text x="846" y="341" font-size="16" font-weight="700" fill="#16212E">Protected data services</text>
    <text x="846" y="365" font-size="12" fill="#5D6875">Encryption, backups, and recovery design</text>
    <rect x="776" y="408" width="284" height="76" rx="17" fill="#FFFFFF" stroke="#D9E0E8"/>
    <path d="M794 465v-31m10 31v-20m10 20v-39m10 39v-27" stroke="#FF9900" stroke-width="2.5" stroke-linecap="round"/>
    <text x="846" y="435" font-size="16" font-weight="700" fill="#16212E">Central observability</text>
    <text x="846" y="459" font-size="12" fill="#5D6875">Metrics, logs, alerts, and service health</text>

    <rect x="120" y="507" width="940" height="35" rx="12" fill="#F1F5F9"/>
    <text x="590" y="530" text-anchor="middle" font-size="12" font-weight="700" fill="#16212E">VERSIONED INFRASTRUCTURE AS CODE  |  IDENTITY CONTROLS  |  BACKUP AND RECOVERY  |  COST VISIBILITY</text>
  </g>
  <text x="94" y="611" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#16212E">REFERENCE NOTE</text>
  <text x="220" y="611" font-family="Arial, sans-serif" font-size="13" fill="#5D6875">The account, network, service, availability, and recovery design must be tailored to the workload and business requirements.</text>
  <circle cx="104" cy="640" r="5" fill="#FF9900"/><text x="120" y="645" font-family="Arial, sans-serif" font-size="12" fill="#74808D">A cloud foundation is an operating baseline, not a promise that every workload needs the same AWS services.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AWS FinOps operating loop</title>
  <desc id="desc">An AWS FinOps loop connects cost allocation and visibility to rightsizing, waste removal, commitment analysis, forecasting, budgets, and engineering feedback while protecting reliability and product demand.</desc>
  <defs><linearGradient id="page" x1="50" y1="30" x2="1140" y2="690" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#E9EFF6"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#16212E" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#FF9900"/></marker></defs>
  <rect x="28" y="24" width="1144" height="672" rx="38" fill="url(#page)"/><rect x="62" y="50" width="1076" height="620" rx="30" fill="#FFFFFF" stroke="#D9E0E8" filter="url(#shadow)"/>
  <rect x="94" y="78" width="206" height="32" rx="16" fill="#16212E"/><text x="197" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#FFFFFF">AWS FINOPS LOOP</text>
  <text x="94" y="151" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16212E">Make cost decisions part of normal engineering work</text><text x="94" y="181" font-family="Arial, sans-serif" font-size="16" fill="#5D6875">Visibility, optimization, commitments, forecasts, and product demand are reviewed as a continuous operating cycle.</text>
  <g font-family="Arial, sans-serif">
    <rect x="100" y="249" width="222" height="142" rx="21" fill="#FFFFFF" stroke="#D9E0E8"/><circle cx="135" cy="284" r="16" fill="#FFF4E5" stroke="#FF9900" stroke-width="2"/><text x="135" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#6B4300">1</text><text x="164" y="286" font-size="17" font-weight="700" fill="#16212E">Allocate and show</text><text x="126" y="327" font-size="13" fill="#5D6875">Tags, accounts, owners</text><text x="126" y="351" font-size="13" fill="#5D6875">Unit costs and trends</text><text x="126" y="375" font-size="13" fill="#5D6875">Shared cost rules</text>
    <path d="M330 320H373" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="385" y="249" width="222" height="142" rx="21" fill="#16212E"/><circle cx="420" cy="284" r="16" fill="#FF9900"/><text x="420" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#16212E">2</text><text x="449" y="286" font-size="17" font-weight="700" fill="#FFFFFF">Rightsize and clean</text><text x="411" y="327" font-size="13" fill="#D7DEE7">Idle and oversized resources</text><text x="411" y="351" font-size="13" fill="#D7DEE7">Storage and data transfer</text><text x="411" y="375" font-size="13" fill="#D7DEE7">Kubernetes requests and nodes</text>
    <path d="M615 320H658" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="670" y="249" width="222" height="142" rx="21" fill="#FFFFFF" stroke="#D9E0E8"/><circle cx="705" cy="284" r="16" fill="#FFF4E5" stroke="#FF9900" stroke-width="2"/><text x="705" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#6B4300">3</text><text x="734" y="286" font-size="17" font-weight="700" fill="#16212E">Evaluate commitments</text><text x="696" y="327" font-size="13" fill="#5D6875">Stable usage baseline</text><text x="696" y="351" font-size="13" fill="#5D6875">Coverage and flexibility</text><text x="696" y="375" font-size="13" fill="#5D6875">Savings Plan scenarios</text>
    <path d="M900 320H943" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="955" y="249" width="151" height="142" rx="21" fill="#FFF4E5" stroke="#FFB84D"/><circle cx="988" cy="284" r="16" fill="#FF9900"/><text x="988" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#16212E">4</text><text x="1016" y="286" font-size="16" font-weight="700" fill="#6B4300">Forecast</text><text x="981" y="327" font-size="12" fill="#7A5521">Budgets and alerts</text><text x="981" y="351" font-size="12" fill="#7A5521">Demand scenarios</text><text x="981" y="375" font-size="12" fill="#7A5521">Variance review</text>

    <path d="M1031 399V447" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="670" y="459" width="436" height="94" rx="20" fill="#F1F5F9"/><circle cx="706" cy="493" r="16" fill="#FFF4E5" stroke="#FF9900" stroke-width="2"/><text x="706" y="499" text-anchor="middle" font-size="14" font-weight="700" fill="#6B4300">5</text><text x="735" y="495" font-size="17" font-weight="700" fill="#16212E">Engineering and product feedback</text><text x="696" y="523" font-size="12" fill="#5D6875">Cost signals become owner actions, backlog priorities,</text><text x="696" y="542" font-size="12" fill="#5D6875">architecture changes, and updated forecasts.</text>
    <path d="M662 506H335C276 506 242 475 242 421V404" fill="none" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="100" y="459" width="454" height="94" rx="20" fill="#FFFFFF" stroke="#D9E0E8"/><text x="127" y="491" font-size="13" font-weight="700" letter-spacing=".7" fill="#74808D">GUARDRAILS</text><text x="127" y="523" font-size="14" font-weight="700" fill="#16212E">Reliability</text><circle cx="205" cy="519" r="3" fill="#FF9900"/><text x="222" y="523" font-size="14" font-weight="700" fill="#16212E">Security</text><circle cx="286" cy="519" r="3" fill="#FF9900"/><text x="303" y="523" font-size="14" font-weight="700" fill="#16212E">Performance</text><circle cx="395" cy="519" r="3" fill="#FF9900"/><text x="412" y="523" font-size="14" font-weight="700" fill="#16212E">Delivery speed</text>
  </g>
  <text x="94" y="611" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#16212E">FINOPS NOTE</text><text x="190" y="611" font-family="Arial, sans-serif" font-size="13" fill="#5D6875">Savings depend on usage patterns and implementation. Commitment purchases follow measured demand, coverage targets, and business risk.</text>
  <circle cx="104" cy="640" r="5" fill="#FF9900"/><text x="120" y="645" font-family="Arial, sans-serif" font-size="12" fill="#74808D">Optimization is continuous because architecture, traffic, pricing, and product priorities change over time.</text>
</svg>

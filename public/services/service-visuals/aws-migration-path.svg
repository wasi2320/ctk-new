<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AWS cloud migration and validation path</title>
  <desc id="desc">A migration moves from workload discovery and dependency mapping through AWS landing zone preparation, a test migration, controlled cutover, and validation, with backup, rollback, and ownership checkpoints throughout.</desc>
  <defs><linearGradient id="page" x1="50" y1="30" x2="1140" y2="690" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#E9EFF6"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#16212E" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#FF9900"/></marker></defs>
  <rect x="28" y="24" width="1144" height="672" rx="38" fill="url(#page)"/><rect x="62" y="50" width="1076" height="620" rx="30" fill="#FFFFFF" stroke="#D9E0E8" filter="url(#shadow)"/>
  <rect x="94" y="78" width="220" height="32" rx="16" fill="#16212E"/><text x="204" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#FFFFFF">AWS MIGRATION PATH</text>
  <text x="94" y="151" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16212E">Reduce migration risk with staged evidence and rollback</text><text x="94" y="181" font-family="Arial, sans-serif" font-size="16" fill="#5D6875">Dependencies, target controls, testing, cutover, and acceptance criteria are resolved before source systems are retired.</text>
  <g font-family="Arial, sans-serif">
    <rect x="94" y="250" width="182" height="220" rx="20" fill="#FFFFFF" stroke="#D9E0E8"/><circle cx="126" cy="282" r="16" fill="#FFF4E5" stroke="#FF9900" stroke-width="2"/><text x="126" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#6B4300">1</text><text x="153" y="288" font-size="17" font-weight="700" fill="#16212E">Discover</text><path d="M120 319H250" stroke="#E2E8F0"/><text x="120" y="350" font-size="13" fill="#5D6875">Inventory workloads</text><text x="120" y="378" font-size="13" fill="#5D6875">Map dependencies</text><text x="120" y="406" font-size="13" fill="#5D6875">Define downtime</text><text x="120" y="434" font-size="13" fill="#5D6875">Set acceptance tests</text>
    <path d="M284 360H304" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="316" y="250" width="182" height="220" rx="20" fill="#FFFFFF" stroke="#D9E0E8"/><circle cx="348" cy="282" r="16" fill="#FFF4E5" stroke="#FF9900" stroke-width="2"/><text x="348" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#6B4300">2</text><text x="375" y="288" font-size="17" font-weight="700" fill="#16212E">Prepare AWS</text><path d="M342 319H472" stroke="#E2E8F0"/><text x="342" y="350" font-size="13" fill="#5D6875">Landing zone</text><text x="342" y="378" font-size="13" fill="#5D6875">Network and identity</text><text x="342" y="406" font-size="13" fill="#5D6875">Security and logging</text><text x="342" y="434" font-size="13" fill="#5D6875">Backup and recovery</text>
    <path d="M506 360H526" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="538" y="250" width="182" height="220" rx="20" fill="#16212E"/><circle cx="570" cy="282" r="16" fill="#FF9900"/><text x="570" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#16212E">3</text><text x="597" y="288" font-size="17" font-weight="700" fill="#FFFFFF">Test migration</text><path d="M564 319H694" stroke="#445164"/><text x="564" y="350" font-size="13" fill="#D7DEE7">Representative workload</text><text x="564" y="378" font-size="13" fill="#D7DEE7">Data synchronization</text><text x="564" y="406" font-size="13" fill="#D7DEE7">Performance and security</text><text x="564" y="434" font-size="13" fill="#D7DEE7">Runbook rehearsal</text>
    <path d="M728 360H748" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="760" y="250" width="162" height="220" rx="20" fill="#FFF4E5" stroke="#FFB84D"/><circle cx="792" cy="282" r="16" fill="#FF9900"/><text x="792" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#16212E">4</text><text x="819" y="288" font-size="17" font-weight="700" fill="#6B4300">Cut over</text><path d="M786 319H896" stroke="#F1C27A"/><text x="786" y="350" font-size="13" fill="#7A5521">Change window</text><text x="786" y="378" font-size="13" fill="#7A5521">Final data sync</text><text x="786" y="406" font-size="13" fill="#7A5521">Traffic transition</text><text x="786" y="434" font-size="13" fill="#7A5521">Rollback decision</text>
    <path d="M930 360H950" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="962" y="250" width="144" height="220" rx="20" fill="#FFFFFF" stroke="#D9E0E8"/><circle cx="994" cy="282" r="16" fill="#FFF4E5" stroke="#FF9900" stroke-width="2"/><text x="994" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#6B4300">5</text><text x="1020" y="288" font-size="16" font-weight="700" fill="#16212E">Validate</text><path d="M988 319H1080" stroke="#E2E8F0"/><text x="988" y="350" font-size="12" fill="#5D6875">User journeys</text><text x="988" y="378" font-size="12" fill="#5D6875">Data integrity</text><text x="988" y="406" font-size="12" fill="#5D6875">Monitoring</text><text x="988" y="434" font-size="12" fill="#5D6875">Owner signoff</text>
    <rect x="94" y="505" width="1012" height="54" rx="16" fill="#F1F5F9"/><text x="120" y="537" font-size="12" font-weight="700" letter-spacing=".7" fill="#74808D">SAFETY TRACK</text><text x="245" y="537" font-size="13" font-weight="700" fill="#16212E">Backups and rollback</text><circle cx="407" cy="533" r="3" fill="#FF9900"/><text x="424" y="537" font-size="13" font-weight="700" fill="#16212E">Security validation</text><circle cx="565" cy="533" r="3" fill="#FF9900"/><text x="582" y="537" font-size="13" font-weight="700" fill="#16212E">Cost baseline</text><circle cx="686" cy="533" r="3" fill="#FF9900"/><text x="703" y="537" font-size="13" font-weight="700" fill="#16212E">Runbook and ownership</text><circle cx="871" cy="533" r="3" fill="#FF9900"/><text x="888" y="537" font-size="13" font-weight="700" fill="#16212E">Source retirement gate</text>
  </g>
  <text x="94" y="611" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#16212E">MIGRATION NOTE</text><text x="215" y="611" font-family="Arial, sans-serif" font-size="13" fill="#5D6875">The sequence and tools depend on source platforms, data volume, dependency risk, downtime tolerance, and regulatory scope.</text>
  <circle cx="104" cy="640" r="5" fill="#FF9900"/><text x="120" y="645" font-family="Arial, sans-serif" font-size="12" fill="#74808D">Source retirement follows validated acceptance criteria and an agreed stabilization period.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AWS security controls and compliance evidence flow</title>
  <desc id="desc">Identity, network, data protection, logging, and monitoring controls protect an AWS workload. Findings feed remediation and versioned changes, while control records feed an evidence set for readiness and independent review where required.</desc>
  <defs><linearGradient id="page" x1="50" y1="30" x2="1140" y2="690" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#E9EFF6"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#16212E" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#FF9900"/></marker><marker id="grayArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#74808D"/></marker></defs>
  <rect x="28" y="24" width="1144" height="672" rx="38" fill="url(#page)"/><rect x="62" y="50" width="1076" height="620" rx="30" fill="#FFFFFF" stroke="#D9E0E8" filter="url(#shadow)"/>
  <rect x="94" y="78" width="234" height="32" rx="16" fill="#16212E"/><text x="211" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#FFFFFF">AWS SECURITY CONTROLS</text>
  <text x="94" y="151" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16212E">Protect the workload and produce usable control evidence</text><text x="94" y="181" font-family="Arial, sans-serif" font-size="16" fill="#5D6875">Preventive, detective, and corrective controls connect security operations to readiness work.</text>
  <rect x="90" y="211" width="820" height="350" rx="24" fill="#FBFCFE" stroke="#96A2AF" stroke-width="2"/><rect x="112" y="195" width="174" height="34" rx="17" fill="#FFF4E5" stroke="#FFB84D"/><text x="199" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".8" fill="#6B4300">CONTROLLED AWS SCOPE</text>
  <g font-family="Arial, sans-serif">
    <rect x="118" y="267" width="168" height="138" rx="18" fill="#FFFFFF" stroke="#D9E0E8"/><path d="M143 320v-8a13 13 0 0126 0v8m-31 0h36v25h-36z" fill="none" stroke="#FF9900" stroke-width="3"/><text x="202" y="300" font-size="16" font-weight="700" fill="#16212E">Identity</text><text x="202" y="325" font-size="12" fill="#5D6875">IAM and MFA</text><text x="202" y="346" font-size="12" fill="#5D6875">Least privilege</text><text x="202" y="367" font-size="12" fill="#5D6875">Access review</text>
    <path d="M294 336H320" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="332" y="267" width="168" height="138" rx="18" fill="#FFFFFF" stroke="#D9E0E8"/><path d="M357 309l20-10 20 10v16c0 13-9 22-20 28-11-6-20-15-20-28z" fill="#FFF4E5" stroke="#FF9900" stroke-width="2.5"/><text x="416" y="300" font-size="16" font-weight="700" fill="#16212E">Network</text><text x="416" y="325" font-size="12" fill="#5D6875">Segmentation</text><text x="416" y="346" font-size="12" fill="#5D6875">Private paths</text><text x="416" y="367" font-size="12" fill="#5D6875">Ingress controls</text>
    <path d="M508 336H534" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="546" y="267" width="168" height="138" rx="18" fill="#16212E"/><path d="M571 321v-8a13 13 0 0126 0v8m-31 0h36v25h-36z" fill="none" stroke="#FF9900" stroke-width="3"/><text x="630" y="300" font-size="16" font-weight="700" fill="#FFFFFF">Data</text><text x="630" y="325" font-size="12" fill="#D7DEE7">KMS encryption</text><text x="630" y="346" font-size="12" fill="#D7DEE7">Secrets protection</text><text x="630" y="367" font-size="12" fill="#D7DEE7">Backup controls</text>
    <path d="M722 336H748" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="760" y="267" width="124" height="138" rx="18" fill="#FFF4E5" stroke="#FFB84D"/><path d="M780 367v-38m10 38v-24m10 24v-48m10 48v-32" stroke="#B85F00" stroke-width="3" stroke-linecap="round"/><text x="822" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#6B4300">Logging</text><text x="822" y="390" text-anchor="middle" font-size="11" fill="#7A5521">Access and change</text>

    <rect x="118" y="440" width="370" height="82" rx="17" fill="#F1F5F9"/><path d="M142 491l10-14 11 8 18-28" fill="none" stroke="#FF9900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="199" y="469" font-size="15" font-weight="700" fill="#16212E">Monitoring and findings</text><text x="199" y="493" font-size="12" fill="#5D6875">Alerts, posture signals, vulnerabilities, owners</text>
    <rect x="514" y="440" width="370" height="82" rx="17" fill="#F1F5F9"/><path d="M539 482a16 16 0 1028-10M567 472v12h-12" fill="none" stroke="#FF9900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="588" y="469" font-size="15" font-weight="700" fill="#16212E">Remediation and change control</text><text x="588" y="493" font-size="12" fill="#5D6875">Prioritized fixes, versioned IaC, review, and validation</text>
    <path d="M488 481H503" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>

    <path d="M918 380H949" stroke="#74808D" stroke-width="3" marker-end="url(#grayArrow)"/>
    <rect x="961" y="281" width="151" height="196" rx="20" fill="#FFFFFF" stroke="#96A2AF" stroke-width="2"/>
    <path d="M987 321h96v72h-96zM1000 340h70M1000 356h52M1000 372h61" fill="none" stroke="#FF9900" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1036" y="421" text-anchor="middle" font-size="15" font-weight="700" fill="#16212E">Evidence set</text><text x="1036" y="444" text-anchor="middle" font-size="12" fill="#5D6875">Policies, logs, approvals,</text><text x="1036" y="462" text-anchor="middle" font-size="12" fill="#5D6875">tests, and records</text>
  </g>
  <text x="94" y="611" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#16212E">SCOPE NOTE</text><text x="184" y="611" font-family="Arial, sans-serif" font-size="13" fill="#5D6875">Technical controls and evidence support readiness. Formal assessments and certifications are performed by authorized independent parties.</text>
  <circle cx="104" cy="640" r="5" fill="#FF9900"/><text x="120" y="645" font-family="Arial, sans-serif" font-size="12" fill="#74808D">Control selection depends on workload risk, framework scope, company policies, and assessor requirements.</text>
</svg>

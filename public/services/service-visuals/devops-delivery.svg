<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">AWS DevOps delivery workflow</title>
  <desc id="desc">A code change moves through CI checks, an artifact registry, controlled deployment, and an AWS runtime supported by infrastructure as code, security checks, observability, and rollback.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="24" x2="690" y2="496" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2F7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16212E" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#FF9900"/></marker>
  </defs>
  <rect x="28" y="24" width="664" height="472" rx="32" fill="url(#bg)"/>
  <rect x="54" y="50" width="612" height="420" rx="26" fill="#fff" stroke="#D9E0E8" filter="url(#shadow)"/>
  <rect x="80" y="74" width="176" height="30" rx="15" fill="#16212E"/>
  <text x="168" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#fff">AWS DELIVERY SYSTEM</text>
  <text x="80" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#16212E">A repeatable and observable path to production</text>
  <text x="80" y="166" font-family="Arial, sans-serif" font-size="14" fill="#5D6875">Automation includes the controls and recovery path around deployment.</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="205" width="94" height="96" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
    <path d="M105 230h18l8 8h18v30h-44z" fill="none" stroke="#FF9900" stroke-width="3"/>
    <text x="127" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#16212E">Code change</text>
    <path d="M182 253H202" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="210" y="205" width="94" height="96" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
    <path d="M232 247l10 10 22-27M232 269h48" fill="none" stroke="#FF9900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="257" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#16212E">CI checks</text>
    <path d="M312 253H332" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="340" y="205" width="94" height="96" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
    <path d="M363 233l24-10 24 10-24 10zM363 233v26l24 11 24-11v-26" fill="#FFF4E5" stroke="#FF9900" stroke-width="2"/>
    <text x="387" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#16212E">Artifact</text>
    <path d="M442 253H462" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="470" y="205" width="94" height="96" rx="16" fill="#16212E"/>
    <path d="M491 252h46M528 240l12 12-12 12" fill="none" stroke="#FF9900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="517" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Deploy</text>
    <path d="M572 253H588" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="596" y="205" width="44" height="96" rx="16" fill="#FFF4E5" stroke="#FFB84D"/>
    <path d="M607 250c0-9 6-15 14-15 7 0 12 4 14 10" fill="none" stroke="#B85F00" stroke-width="3" stroke-linecap="round"/>
    <text x="618" y="286" text-anchor="middle" font-size="10" font-weight="700" fill="#6B4300">AWS</text>
  </g>
  <text x="80" y="343" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#74808D">DELIVERY CONTROLS</text>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#16212E">
    <rect x="80" y="362" width="126" height="54" rx="14" fill="#F8FAFC" stroke="#D9E0E8"/><text x="143" y="394" text-anchor="middle">IaC</text>
    <rect x="222" y="362" width="126" height="54" rx="14" fill="#F8FAFC" stroke="#D9E0E8"/><text x="285" y="394" text-anchor="middle">Security checks</text>
    <rect x="364" y="362" width="126" height="54" rx="14" fill="#F8FAFC" stroke="#D9E0E8"/><text x="427" y="394" text-anchor="middle">Observability</text>
    <rect x="506" y="362" width="134" height="54" rx="14" fill="#F8FAFC" stroke="#D9E0E8"/><text x="573" y="394" text-anchor="middle">Rollback</text>
  </g>
  <path d="M96 434H624" stroke="#FF9900" stroke-width="3" stroke-linecap="round"/>
  <text x="360" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#6B4300">VERSIONED, REVIEWABLE, AND OPERABLE BY THE TEAM</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AWS technical safeguards for HIPAA-regulated workloads</title>
  <desc id="desc">An approved HIPAA-eligible AWS service scope contains a private Amazon EKS workload protected by IAM, Kubernetes RBAC, MFA, AWS KMS encryption, audit logging, and backup and recovery controls.</desc>
  <defs>
    <linearGradient id="page" x1="55" y1="30" x2="1140" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E9EFF6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#16212E" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#FF9900"/>
    </marker>
  </defs>
  <rect x="28" y="24" width="1144" height="672" rx="38" fill="url(#page)"/>
  <rect x="62" y="50" width="1076" height="620" rx="30" fill="#FFFFFF" stroke="#D9E0E8" filter="url(#shadow)"/>
  <rect x="94" y="78" width="244" height="32" rx="16" fill="#16212E"/>
  <text x="216" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#FFFFFF">HIPAA TECHNICAL SAFEGUARDS</text>
  <text x="94" y="151" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16212E">Protected workload controls on AWS and Amazon EKS</text>
  <text x="94" y="181" font-family="Arial, sans-serif" font-size="16" fill="#5D6875">Service eligibility, access, encryption, evidence, and recovery are designed as one control system.</text>

  <rect x="90" y="211" width="1020" height="350" rx="24" fill="#FBFCFE" stroke="#96A2AF" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="112" y="195" width="328" height="34" rx="17" fill="#FFF4E5" stroke="#FFB84D"/>
  <text x="285" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".8" fill="#6B4300">APPROVED HIPAA-ELIGIBLE AWS SERVICE SCOPE</text>

  <g font-family="Arial, sans-serif">
    <rect x="118" y="272" width="220" height="178" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="160" cy="314" r="17" fill="#FFF4E5" stroke="#FF9900" stroke-width="2"/>
    <circle cx="160" cy="308" r="6" fill="#FF9900"/>
    <path d="M149 326c2-8 20-8 22 0" fill="none" stroke="#FF9900" stroke-width="3" stroke-linecap="round"/>
    <text x="190" y="309" font-size="16" font-weight="700" fill="#16212E">Authorized access</text>
    <text x="190" y="332" font-size="13" fill="#5D6875">Workforce and services</text>
    <path d="M138 352H318" stroke="#E2E8F0"/>
    <rect x="138" y="370" width="70" height="30" rx="15" fill="#F1F5F9"/><text x="173" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#16212E">IAM</text>
    <rect x="217" y="370" width="82" height="30" rx="15" fill="#F1F5F9"/><text x="258" y="390" text-anchor="middle" font-size="12" font-weight="700" fill="#16212E">EKS RBAC</text>
    <rect x="138" y="409" width="70" height="26" rx="13" fill="#FFF4E5"/><text x="173" y="427" text-anchor="middle" font-size="12" font-weight="700" fill="#6B4300">MFA</text>
    <text x="218" y="427" font-size="12" fill="#5D6875">Least privilege</text>

    <path d="M346 360H389" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="400" y="260" width="310" height="204" rx="22" fill="#16212E"/>
    <rect x="426" y="284" width="118" height="28" rx="14" fill="#2D3948"/>
    <text x="485" y="303" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#FFFFFF">PRIVATE SUBNETS</text>
    <path d="M452 344h58l18 18-18 18h-58l-18-18z" fill="none" stroke="#FF9900" stroke-width="3"/>
    <circle cx="481" cy="362" r="7" fill="#FF9900"/>
    <text x="551" y="346" font-size="20" font-weight="700" fill="#FFFFFF">Amazon EKS</text>
    <text x="551" y="371" font-size="12" fill="#D7DEE7">Private application workload</text>
    <path d="M430 404H680" stroke="#445164"/>
    <text x="555" y="431" text-anchor="middle" font-size="11" fill="#FFFFFF">Encrypted network paths and isolated workload access</text>

    <path d="M718 308H753" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M718 361H753" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M718 414H753" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="764" y="266" width="296" height="78" rx="17" fill="#FFFFFF" stroke="#D9E0E8"/>
    <path d="M790 301v-8a13 13 0 0126 0v8m-31 0h36v25h-36z" fill="none" stroke="#FF9900" stroke-width="3"/>
    <text x="837" y="296" font-size="16" font-weight="700" fill="#16212E">AWS KMS encryption</text>
    <text x="837" y="318" font-size="13" fill="#5D6875">Data, volumes, backups, and secrets</text>

    <rect x="764" y="354" width="296" height="78" rx="17" fill="#FFFFFF" stroke="#D9E0E8"/>
    <path d="M786 411v-28m11 28v-18m11 18v-35m11 35v-24" stroke="#FF9900" stroke-width="3" stroke-linecap="round"/>
    <text x="837" y="384" font-size="16" font-weight="700" fill="#16212E">Audit logging</text>
    <text x="837" y="406" font-size="13" fill="#5D6875">Access, API, workload, and change events</text>

    <rect x="764" y="442" width="296" height="78" rx="17" fill="#FFFFFF" stroke="#D9E0E8"/>
    <path d="M786 478a18 18 0 1032-10M818 468v14h-14" fill="none" stroke="#FF9900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="837" y="472" font-size="16" font-weight="700" fill="#16212E">Backup and recovery</text>
    <text x="837" y="494" font-size="13" fill="#5D6875">Encrypted backups and tested restore path</text>
  </g>

  <text x="94" y="611" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#16212E">SCOPE NOTE</text>
  <text x="184" y="611" font-family="Arial, sans-serif" font-size="13" fill="#5D6875">Technical safeguards support HIPAA-regulated workloads. Compliance also depends on customer policies, agreements, and operations.</text>
  <circle cx="104" cy="640" r="5" fill="#FF9900"/>
  <text x="120" y="645" font-family="Arial, sans-serif" font-size="12" fill="#74808D">Verify the AWS BAA and current service eligibility for every system that creates, receives, maintains, or transmits PHI.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Mobile application system</title>
  <desc id="desc">iOS and Android applications connect through authentication and APIs to cloud application services, data, notifications, testing, release automation, and monitoring.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="24" x2="690" y2="496" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2F7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16212E" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#FF9900"/></marker>
  </defs>
  <rect x="28" y="24" width="664" height="472" rx="32" fill="url(#bg)"/>
  <rect x="54" y="50" width="612" height="420" rx="26" fill="#fff" stroke="#D9E0E8" filter="url(#shadow)"/>
  <rect x="80" y="74" width="182" height="30" rx="15" fill="#16212E"/>
  <text x="171" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#fff">MOBILE PRODUCT SYSTEM</text>
  <text x="80" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#16212E">One product across devices and cloud services</text>
  <text x="80" y="166" font-family="Arial, sans-serif" font-size="14" fill="#5D6875">The app, APIs, release path, and operations are designed together.</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="201" width="116" height="104" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
    <rect x="101" y="220" width="31" height="52" rx="7" fill="none" stroke="#FF9900" stroke-width="3"/><circle cx="116.5" cy="264" r="2" fill="#FF9900"/>
    <rect x="143" y="220" width="31" height="52" rx="7" fill="none" stroke="#16212E" stroke-width="3"/><circle cx="158.5" cy="264" r="2" fill="#16212E"/>
    <text x="138" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#16212E">iOS and Android</text>
    <path d="M204 253H230" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="238" y="201" width="116" height="104" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
    <path d="M281 249v-8a15 15 0 0130 0v8m-36 0h42v29h-42z" fill="#FFF4E5" stroke="#FF9900" stroke-width="2"/>
    <text x="296" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#16212E">Auth and API</text>
    <path d="M362 253H388" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="396" y="201" width="116" height="104" rx="16" fill="#16212E"/>
    <circle cx="433" cy="244" r="16" fill="none" stroke="#FF9900" stroke-width="3"/><path d="M449 244h28M463 230v28" stroke="#FF9900" stroke-width="3"/>
    <text x="454" y="283" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">App services</text>
    <path d="M520 253H546" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="554" y="201" width="86" height="104" rx="16" fill="#FFF4E5" stroke="#FFB84D"/>
    <ellipse cx="597" cy="232" rx="21" ry="8" fill="none" stroke="#B85F00" stroke-width="2"/><path d="M576 232v25c0 5 9 8 21 8s21-3 21-8v-25M576 245c0 5 9 8 21 8s21-3 21-8" fill="none" stroke="#B85F00" stroke-width="2"/>
    <text x="597" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#6B4300">Data and alerts</text>
  </g>
  <text x="80" y="345" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#74808D">RELEASE AND OPERATIONS</text>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#16212E">
    <rect x="80" y="363" width="168" height="58" rx="14" fill="#F8FAFC" stroke="#D9E0E8"/><text x="164" y="397" text-anchor="middle">Device testing</text>
    <rect x="267" y="363" width="168" height="58" rx="14" fill="#F8FAFC" stroke="#D9E0E8"/><text x="351" y="397" text-anchor="middle">Store release</text>
    <rect x="454" y="363" width="186" height="58" rx="14" fill="#F8FAFC" stroke="#D9E0E8"/><text x="547" y="397" text-anchor="middle">Analytics and crashes</text>
  </g>
  <text x="80" y="451" font-family="Arial, sans-serif" font-size="12" fill="#74808D">Platform choice follows device needs, ownership, and maintenance requirements.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">SOC 2 technical controls and evidence flow on AWS</title>
  <desc id="desc">AWS identity controls and versioned infrastructure changes protect a Multi-AZ workload. Logging, monitoring, and recovery records flow into an evidence set that is reviewed by an independent auditor.</desc>
  <defs>
    <linearGradient id="page" x1="55" y1="30" x2="1140" y2="690" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#E9EFF6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#16212E" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#FF9900"/></marker>
    <marker id="grayArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#74808D"/></marker>
  </defs>
  <rect x="28" y="24" width="1144" height="672" rx="38" fill="url(#page)"/>
  <rect x="62" y="50" width="1076" height="620" rx="30" fill="#FFFFFF" stroke="#D9E0E8" filter="url(#shadow)"/>
  <rect x="94" y="78" width="220" height="32" rx="16" fill="#16212E"/>
  <text x="204" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#FFFFFF">SOC 2 CONTROL SYSTEM</text>
  <text x="94" y="151" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#16212E">AWS controls that produce reviewable evidence</text>
  <text x="94" y="181" font-family="Arial, sans-serif" font-size="16" fill="#5D6875">Identity, change management, availability, logging, and monitoring connect to the independent audit process.</text>

  <rect x="90" y="211" width="835" height="350" rx="24" fill="#FBFCFE" stroke="#96A2AF" stroke-width="2"/>
  <rect x="112" y="195" width="178" height="34" rx="17" fill="#FFF4E5" stroke="#FFB84D"/>
  <text x="208" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".8" fill="#6B4300">CONTROLLED AWS SCOPE</text>

  <g font-family="Arial, sans-serif">
    <rect x="118" y="258" width="202" height="104" rx="18" fill="#FFFFFF" stroke="#D9E0E8"/>
    <path d="M143 306v-8a13 13 0 0126 0v8m-31 0h36v25h-36z" fill="none" stroke="#FF9900" stroke-width="3"/>
    <text x="188" y="294" font-size="16" font-weight="700" fill="#16212E">IAM and MFA</text>
    <text x="188" y="318" font-size="13" fill="#5D6875">Least-privilege access</text>
    <text x="188" y="339" font-size="13" fill="#5D6875">and periodic review</text>

    <rect x="118" y="389" width="202" height="112" rx="18" fill="#FFFFFF" stroke="#D9E0E8"/>
    <path d="M140 418h34v43h-34zM147 427h20M147 437h20M147 447h13" fill="none" stroke="#FF9900" stroke-width="3" stroke-linecap="round"/>
    <text x="188" y="420" font-size="16" font-weight="700" fill="#16212E">Versioned IaC</text>
    <text x="188" y="444" font-size="13" fill="#5D6875">Peer-approved changes</text>
    <text x="188" y="465" font-size="13" fill="#5D6875">and deployment history</text>

    <path d="M328 311H368" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M328 444H368" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="380" y="258" width="250" height="202" rx="22" fill="#16212E"/>
    <text x="505" y="292" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Multi-AZ application</text>
    <rect x="407" y="316" width="88" height="82" rx="14" fill="#2D3948" stroke="#FF9900"/>
    <text x="451" y="341" text-anchor="middle" font-size="11" font-weight="700" fill="#FFB84D">AZ A</text>
    <rect x="426" y="352" width="50" height="22" rx="5" fill="#FFFFFF"/>
    <rect x="515" y="316" width="88" height="82" rx="14" fill="#2D3948" stroke="#FF9900"/>
    <text x="559" y="341" text-anchor="middle" font-size="11" font-weight="700" fill="#FFB84D">AZ B</text>
    <rect x="534" y="352" width="50" height="22" rx="5" fill="#FFFFFF"/>
    <path d="M495 357H515" stroke="#FF9900" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="505" y="430" text-anchor="middle" font-size="13" fill="#D7DEE7">Redundant service and data paths</text>

    <rect x="380" y="478" width="250" height="58" rx="15" fill="#FFF4E5" stroke="#FFB84D"/>
    <path d="M405 507a13 13 0 1023-8M428 499v10h-10" fill="none" stroke="#B85F00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="445" y="505" font-size="14" font-weight="700" fill="#6B4300">Backup and recovery records</text>
    <text x="445" y="524" font-size="12" fill="#7A5521">Restore tests and recovery evidence</text>

    <path d="M638 310H668" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M638 413H668" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="680" y="258" width="218" height="92" rx="17" fill="#FFFFFF" stroke="#D9E0E8"/>
    <path d="M705 323v-37m12 37v-24m12 24v-45m12 45v-31" stroke="#FF9900" stroke-width="3" stroke-linecap="round"/>
    <text x="758" y="288" font-size="16" font-weight="700" fill="#16212E">Central logging</text>
    <text x="758" y="307" font-size="12" fill="#5D6875">Access and change events</text>
    <text x="758" y="325" font-size="12" fill="#5D6875">System events</text>
    <text x="758" y="343" font-size="12" fill="#5D6875">Defined retention</text>

    <rect x="680" y="371" width="218" height="92" rx="17" fill="#FFFFFF" stroke="#D9E0E8"/>
    <path d="M704 431l10-15 11 8 18-28" fill="none" stroke="#FF9900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="758" y="401" font-size="16" font-weight="700" fill="#16212E">Monitoring</text>
    <text x="758" y="420" font-size="12" fill="#5D6875">Alerts and incidents</text>
    <text x="758" y="438" font-size="12" fill="#5D6875">Availability status</text>
    <text x="758" y="456" font-size="12" fill="#5D6875">Response records</text>

    <rect x="680" y="484" width="218" height="52" rx="15" fill="#FFF4E5" stroke="#FFB84D"/>
    <text x="789" y="507" text-anchor="middle" font-size="14" font-weight="700" fill="#6B4300">CONTROL EVIDENCE SET</text>
    <text x="789" y="526" text-anchor="middle" font-size="12" fill="#7A5521">Logs, approvals, tests, and records</text>

    <path d="M906 510H951" stroke="#74808D" stroke-width="3" marker-end="url(#grayArrow)"/>
    <rect x="963" y="352" width="151" height="158" rx="20" fill="#FFFFFF" stroke="#96A2AF" stroke-width="2"/>
    <circle cx="1038" cy="391" r="18" fill="#F1F5F9" stroke="#74808D" stroke-width="2"/>
    <path d="M1028 391l7 7 14-16" fill="none" stroke="#74808D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1038" y="427" text-anchor="middle" font-size="15" font-weight="700" fill="#16212E">Independent</text>
    <text x="1038" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#16212E">auditor</text>
    <text x="1038" y="475" text-anchor="middle" font-size="12" fill="#5D6875">Reviews design and</text>
    <text x="1038" y="493" text-anchor="middle" font-size="12" fill="#5D6875">operating evidence</text>
  </g>

  <text x="94" y="611" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#16212E">RESPONSIBILITY NOTE</text>
  <text x="246" y="611" font-family="Arial, sans-serif" font-size="13" fill="#5D6875">CodetoKloud implements and documents technical controls. An independent CPA firm performs the SOC 2 examination.</text>
  <circle cx="104" cy="640" r="5" fill="#FF9900"/>
  <text x="120" y="645" font-family="Arial, sans-serif" font-size="12" fill="#74808D">The final control set depends on scope, Trust Services Criteria, company policies, and the auditor's requirements.</text>
</svg>

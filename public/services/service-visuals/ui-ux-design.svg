<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">UI and UX product design workflow</title>
  <desc id="desc">A product design workflow moves from discovery and user journeys through prototyping and validation to a reusable interface system and engineering handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="24" x2="690" y2="496" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2F7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16212E" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#FF9900"/></marker>
  </defs>
  <rect x="28" y="24" width="664" height="472" rx="32" fill="url(#bg)"/>
  <rect x="54" y="50" width="612" height="420" rx="26" fill="#fff" stroke="#D9E0E8" filter="url(#shadow)"/>
  <rect x="80" y="74" width="164" height="30" rx="15" fill="#16212E"/>
  <text x="162" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#fff">PRODUCT DESIGN PATH</text>
  <text x="80" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#16212E">Resolve product risk before full implementation</text>
  <text x="80" y="166" font-family="Arial, sans-serif" font-size="14" fill="#5D6875">Evidence and structure lead to a testable, buildable interface.</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="205" width="116" height="100" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
    <circle cx="138" cy="240" r="17" fill="none" stroke="#FF9900" stroke-width="3"/><path d="M150 252l14 14" stroke="#FF9900" stroke-width="3" stroke-linecap="round"/>
    <text x="138" y="289" text-anchor="middle" font-size="14" font-weight="700" fill="#16212E">Discover</text>
    <path d="M204 255H230" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="238" y="205" width="116" height="100" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
    <circle cx="270" cy="239" r="7" fill="#FF9900"/><circle cx="322" cy="239" r="7" fill="#FF9900"/><circle cx="296" cy="265" r="7" fill="#16212E"/><path d="M277 241l13 18M315 241l-13 18" stroke="#74808D" stroke-width="2"/>
    <text x="296" y="289" text-anchor="middle" font-size="14" font-weight="700" fill="#16212E">Map journeys</text>
    <path d="M362 255H388" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="396" y="205" width="116" height="100" rx="16" fill="#16212E"/>
    <rect x="418" y="225" width="72" height="44" rx="5" fill="none" stroke="#FF9900" stroke-width="2"/><path d="M430 238h24M430 247h48M430 256h36" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="454" y="289" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Prototype</text>
    <path d="M520 255H546" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="554" y="205" width="86" height="100" rx="16" fill="#FFF4E5" stroke="#FFB84D"/>
    <path d="M575 248l13 13 27-33" fill="none" stroke="#B85F00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="597" y="289" text-anchor="middle" font-size="14" font-weight="700" fill="#6B4300">Validate</text>
  </g>
  <text x="80" y="345" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#74808D">BUILDABLE OUTPUT</text>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#16212E">
    <rect x="80" y="363" width="264" height="62" rx="14" fill="#F8FAFC" stroke="#D9E0E8"/>
    <rect x="104" y="381" width="28" height="26" rx="4" fill="#FF9900"/><rect x="140" y="381" width="28" height="26" rx="4" fill="#16212E"/><path d="M181 384h125M181 394h96M181 404h112" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <text x="212" y="448" text-anchor="middle">Reusable interface system</text>
    <rect x="364" y="363" width="276" height="62" rx="14" fill="#F8FAFC" stroke="#D9E0E8"/>
    <path d="M391 380h48v28h-48zM401 413h28" fill="none" stroke="#FF9900" stroke-width="2"/><path d="M458 381h148M458 393h116M458 405h136" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <text x="502" y="448" text-anchor="middle">Engineering handoff</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Web application delivery architecture</title>
  <desc id="desc">Users reach a web application through an edge and security layer, then connect to application APIs, data, integrations, and production controls on AWS.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="24" x2="690" y2="496" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2F7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16212E" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#FF9900"/></marker>
  </defs>
  <rect x="28" y="24" width="664" height="472" rx="32" fill="url(#bg)"/>
  <rect x="54" y="50" width="612" height="420" rx="26" fill="#fff" stroke="#D9E0E8" filter="url(#shadow)"/>
  <rect x="80" y="74" width="188" height="30" rx="15" fill="#16212E"/>
  <text x="174" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#fff">WEB APPLICATION SYSTEM</text>
  <text x="80" y="140" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#16212E">A complete path from user to cloud service</text>
  <text x="80" y="166" font-family="Arial, sans-serif" font-size="14" fill="#5D6875">Experience, application logic, data, and operations stay connected.</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="205" width="112" height="96" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
    <path d="M108 237h30v22h-30zM112 263h22" fill="none" stroke="#FF9900" stroke-width="3" stroke-linecap="round"/>
    <text x="136" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#16212E">Users</text>
    <path d="M200 253H226" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="234" y="205" width="112" height="96" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
    <path d="M272 232l18-9 18 9v14c0 11-8 19-18 24-10-5-18-13-18-24z" fill="#FFF4E5" stroke="#FF9900" stroke-width="2"/>
    <text x="290" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#16212E">Edge and security</text>
    <path d="M354 253H380" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="388" y="205" width="112" height="96" rx="16" fill="#16212E"/>
    <path d="M412 229h64v38h-64zM412 239h64" fill="none" stroke="#FF9900" stroke-width="2"/>
    <circle cx="419" cy="234" r="2" fill="#FF9900"/><circle cx="426" cy="234" r="2" fill="#FF9900"/>
    <text x="444" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Web application</text>
    <path d="M508 253H534" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="542" y="205" width="98" height="96" rx="16" fill="#FFF4E5" stroke="#FFB84D"/>
    <circle cx="570" cy="244" r="12" fill="none" stroke="#B85F00" stroke-width="2"/><path d="M582 244h18M591 235v18" stroke="#B85F00" stroke-width="2"/>
    <text x="591" y="279" text-anchor="middle" font-size="13" font-weight="700" fill="#6B4300"><tspan x="591">APIs and</tspan><tspan x="591" dy="16">data</tspan></text>
  </g>
  <text x="80" y="343" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#74808D">QUALITY AND OPERATIONS</text>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#16212E">
    <rect x="80" y="362" width="126" height="54" rx="14" fill="#F8FAFC" stroke="#D9E0E8"/><text x="143" y="394" text-anchor="middle">Performance</text>
    <rect x="222" y="362" width="126" height="54" rx="14" fill="#F8FAFC" stroke="#D9E0E8"/><text x="285" y="394" text-anchor="middle">Accessibility</text>
    <rect x="364" y="362" width="126" height="54" rx="14" fill="#F8FAFC" stroke="#D9E0E8"/><text x="427" y="394" text-anchor="middle">Deployment</text>
    <rect x="506" y="362" width="134" height="54" rx="14" fill="#F8FAFC" stroke="#D9E0E8"/><text x="573" y="394" text-anchor="middle">Observability</text>
  </g>
  <path d="M96 434H624" stroke="#FF9900" stroke-width="3" stroke-linecap="round"/>
  <text x="360" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#6B4300">AWS INFRASTRUCTURE AND CI/CD</text>
</svg>
